<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<title>FF Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14112b;--panel:#211c44;--line:#3a3270;--text:#efeaff;--dim:#a79fd0;--flame:#ff6a3d;--gold:#ffc94a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:500 17px/1.4 Rajdhani,system-ui,sans-serif;padding:0 0 84px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;max-width:560px;margin:auto}
h1{font-size:28px;font-weight:700}
main{display:grid;gap:14px;padding:0 16px;max-width:560px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dim{color:var(--dim)}.coins{color:var(--gold);font-weight:700}
.t{font-size:21px;font-weight:700}
.cd{font-size:34px;font-weight:700;color:var(--flame);line-height:1}
button{font:700 17px Rajdhani,sans-serif;background:var(--flame);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45}
input{font:500 17px Rajdhani,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.room{background:var(--bg);border:1px dashed var(--gold);border-radius:10px;padding:10px;display:grid;gap:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--dim);border-radius:0;padding:16px 0}
nav button.on{color:var(--flame);box-shadow:inset 0 3px var(--flame)}
#msg{color:var(--flame)}
</style>
</head>
<body>
<header><h1>FF Arena</h1><span class="coins" id="coins"></span></header>
<main id="view"></main>
<nav id="nav" hidden>
<button data-tab="matches" class="on">Matches</button>
<button data-tab="rank">Leaderboard</button>
<button data-tab="me">Profile</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit,getCountFromServer}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase console > Project settings > Your apps > Web app se config yahan paste karo
const cfg={apiKey:"AIzaSyD1-5WDFX-kv1RzNVgTVSqK4pkNbjGqCGk",authDomain:"sm-zone-aa784.firebaseapp.com",projectId:"sm-zone-aa784",appId:"1:892451469784:web:45b5cc8ef7d5264252daad"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const left=t=>{let m=Math.round((t-Date.now())/6e4);if(m<=0)return"Shuru";const d=Math.floor(m/1440),h=Math.floor(m%1440/60);m%=60;return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`};

let me=null,profile=null,matches=[],ranks=[],tab="matches",subs=[],signup=false;

function authView(){
 $("#nav").hidden=true;$("#coins").textContent="";
 $("#view").innerHTML=`<form class="card" id="af">
 ${signup?`<input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required>`:""}
 <input name="email" type="email" placeholder="Email" required>
 <input name="pw" type="password" placeholder="Password (kam se kam 6 akshar)" minlength="6" required>
 <p id="msg"></p><button>${signup?"Account banao":"Login karo"}</button>
 <button type="button" class="ghost" id="sw">${signup?"Account hai? Login karo":"Naya account banao"}</button></form>`;
 $("#sw").onclick=()=>{signup=!signup;authView()};
 $("#af").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{
   if(signup){const u=await createUserWithEmailAndPassword(auth,f.get("email"),f.get("pw"));
    await setDoc(doc(db,"users",u.user.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),coins:0});}
   else await signInWithEmailAndPassword(auth,f.get("email"),f.get("pw"));
  }catch(err){$("#msg").textContent="Nahi hua: "+(err.code||err.message)}};
}

function profileView(){
 $("#nav").hidden=true;
 $("#view").innerHTML=`<form class="card" id="pf"><div class="t">Profile poora karo</div><input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required><button>Save karo</button><button type="button" class="ghost" id="po">Logout</button></form>`;
 $("#po").onclick=()=>signOut(auth);
 $("#pf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{await setDoc(doc(db,"users",me.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),coins:0});location.reload()}catch(err){alert("Nahi hua: "+(err.code||err.message))}};
}

onAuthStateChanged(auth,async u=>{
 subs.forEach(f=>f());subs=[];me=u;profile=null;
 if(!u)return authView();
 // naya account: profile doc banne ka thoda wait
 for(let i=0;i<5&&!profile;i++){const s=await getDoc(doc(db,"users",u.uid));if(s.exists())profile=s.data();else await new Promise(r=>setTimeout(r,500))}
 if(!profile)return profileView();
 $("#nav").hidden=false;
 subs.push(onSnapshot(doc(db,"users",u.uid),s=>{profile=s.data();$("#coins").textContent=profile.coins+" coins";if(tab=="me")draw()}));
 subs.push(onSnapshot(query(collection(db,"matches"),orderBy("startTime","desc"),limit(30)),s=>load(s.docs.map(d=>({id:d.id,...d.data()})))));
 subs.push(onSnapshot(query(collection(db,"users"),orderBy("coins","desc"),limit(20)),s=>{ranks=s.docs.map(d=>d.data());if(tab=="rank")draw()}));
});

async function load(list){
 await Promise.all(list.map(async m=>{
  const[p,c]=await Promise.all([getDoc(doc(db,"matches",m.id,"players",me.uid)),getCountFromServer(collection(db,"matches",m.id,"players"))]);
  m.joined=p.exists();m.paid=p.exists()&&p.data().paid===true;m.count=c.data().count}));
 matches=list;draw();
}

const card=m=>{
 const up=m.status=="upcoming",full=m.count>=m.slots;
 const label=m.status=="live"?"Live":m.status=="done"?"Khatam":left(m.startTime);
 return`<div class="card"><div class="row"><div><div class="t">${esc(m.title)}</div><div class="dim">${esc(m.mode)}, ${esc(m.map)}</div></div><div class="cd">${label}</div></div>
 <div class="row dim"><span>Prize <b class="coins">₹${m.prizeInr||0}</b></span><span>Fee ${m.fee?"₹"+m.fee:"Free"}</span><span>${m.count}/${m.slots}</span></div>
 ${m.joined?`${!m.fee||m.paid?`<button class="ghost" data-room="${m.id}">Room ID dekho</button>`:`<div class="room"><span>Fee ₹${m.fee} is QR se bhejo ${m.payInfo?`<b>${esc(m.payInfo)}</b>`:""}</span><img src="qr.png" alt="Payment QR" onerror="this.remove()" style="width:100%;max-width:240px;background:#fff;padding:8px;border-radius:10px;justify-self:center"><span class="dim">Admin ke confirm karne par Room ID dikhega.</span></div>`}<div id="r${m.id}"></div>${up&&!m.paid?`<button class="ghost" data-leave="${m.id}">Match chhodo</button>`:""}`
 :up?`<button data-join="${m.id}" ${full?"disabled":""}>${full?"Slots full":(m.fee?"Join karo (fee ₹"+m.fee+")":"Match join karo (free)")}</button>`:""}</div>`};

function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 const v=$("#view");
 if(tab=="matches")v.innerHTML=matches.length?matches.map(card).join(""):`<p class="dim">Abhi koi match nahi hai. Thodi der baad dekho.</p>`;
 if(tab=="rank")v.innerHTML=ranks.map((u,i)=>`<div class="card row"><span class="t">${i+1}. ${esc(u.ign)}</span><b class="coins">${u.coins}</b></div>`).join("");
 if(tab=="me")v.innerHTML=`<div class="card"><div class="t">${esc(profile.ign)}</div><div class="dim">Free Fire UID: ${esc(profile.ffUid)}</div><div class="coins">${profile.coins} coins</div><button class="ghost" id="out">Logout</button></div>`,$("#out").onclick=()=>signOut(auth);
}

$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;draw()}};
$("#view").onclick=async e=>{
 const b=e.target.closest("button[data-join],button[data-leave],button[data-room]");if(!b)return;
 const d=b.dataset,pl=id=>doc(db,"matches",id,"players",me.uid);
 try{
  if(d.join){await setDoc(pl(d.join),{ign:profile.ign,ffUid:profile.ffUid,at:Date.now()});await load(matches)}
  else if(d.leave){await deleteDoc(pl(d.leave));await load(matches)}
  else{const s=await getDoc(doc(db,"matches",d.room,"secret","room")),x=$("#r"+d.room);
   x.innerHTML=s.exists()&&s.data().id?`<div class="room"><span>Room ID: <b>${esc(s.data().id)}</b></span><span>Password: <b>${esc(s.data().pass)}</b></span></div>`:`<p class="dim">Room ID abhi admin ne nahi daala.</p>`}
 }catch(err){alert("Nahi hua: "+(err.code||err.message))}
};
setInterval(()=>{if(me&&tab=="matches")load(matches)},45000);
</script>
</body>
</html>
