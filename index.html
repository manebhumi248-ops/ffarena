<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a18">
<title>SM ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a18;--panel:#16132a;--line:#2f2a52;--text:#efeaff;--dim:#9b93c4;--flame:#ff6a3d;--gold:#ffc94a;--ok:#35d08a;--teal:#12c4a8;--pink:#c44dff;--card:#f4f6fb;--cardt:#1a1a2e;--carddim:#6b7280}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:500 16px/1.4 Rajdhani,system-ui,sans-serif;padding:0 0 84px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:560px;margin:auto}
h1{font-size:24px;font-weight:700;letter-spacing:.5px}
main{display:grid;gap:14px;padding:0 14px 20px;max-width:560px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dim{color:var(--dim)}.coins{color:var(--gold);font-weight:700}.ok{color:var(--ok);font-weight:700}
.t{font-size:20px;font-weight:700}
.crown{text-align:center;font-size:44px;line-height:1}
.pods{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 6px;text-align:center;display:grid;gap:4px;align-content:start;overflow:hidden}
.pod.p1{min-height:220px;border-color:var(--gold);background:linear-gradient(180deg,#2a2150,var(--panel))}
.pod.p2{min-height:180px;border-color:var(--pink)}
.pod.p3{min-height:155px;border-color:var(--teal)}
.pod.empty{visibility:hidden}
.pod .pr{font-size:38px;font-weight:700;line-height:1}
.pod.p1 .pr{color:var(--gold)}.pod.p2 .pr{color:var(--pink)}.pod.p3 .pr{color:var(--teal)}
.pod .pt{font-size:13px;letter-spacing:1px;color:var(--dim)}
.pod .pn{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.pod .pu{font-size:13px;color:var(--dim)}
.ps{background:rgba(53,208,138,.14);border:1px solid rgba(53,208,138,.5);color:var(--ok);font-weight:700;border-radius:10px;padding:4px 10px;justify-self:center;white-space:nowrap}
.rk{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.rk .rn{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.rk .ri{flex:1;min-width:0}.rk .ri .t{font-size:19px;overflow-wrap:anywhere}
.rk.me,.pod.me{outline:2px solid var(--flame)}
.cd{font-size:28px;font-weight:700;color:var(--flame);line-height:1}
button{font:700 16px Rajdhani,sans-serif;background:var(--flame);color:#fff;border:0;border-radius:12px;padding:12px;width:100%;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45}
button.teal{background:var(--teal);color:#042}
input{font:500 16px Rajdhani,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.room{background:#eef1f8;border:1px solid #d1d5db;border-radius:12px;padding:10px;display:grid;gap:8px;color:var(--cardt)}
.room .rline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.room .rline b{color:#0b0a18;font-weight:700}
.room .rcopy{width:auto;padding:6px 12px;font-size:12px;background:#fff;border:1px solid #c4c9d4;color:#1a1a2e;border-radius:8px;font-weight:700}
.room .rcopy:active{background:#e5e7eb}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;color:var(--dim);border-radius:0;padding:14px 0;font-size:13px}
nav button.on{color:var(--flame);box-shadow:inset 0 3px var(--flame)}
#msg{color:var(--flame)}
.ico{position:relative;width:56px;height:56px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-weight:700;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{height:6px;background:#e5e7eb;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--flame))}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rules{padding-left:18px;display:grid;gap:6px}
.dban{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.tabs button.on{background:var(--flame);border-color:var(--flame);color:#fff}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sl{padding:12px 0;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.sl.on{background:var(--flame);border-color:var(--flame);color:#fff}
.sl:disabled{opacity:.35;text-decoration:line-through}
.notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px}
/* Match filter */
.mtabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--panel);border-radius:14px;padding:4px;border:1px solid var(--line)}
.mtabs button{background:transparent;color:var(--dim);border-radius:10px;padding:10px;font-size:15px}
.mtabs button.on{background:transparent;color:var(--pink);box-shadow:inset 0 -3px var(--pink)}
/* Light match card like target UI */
.mc{background:var(--card);color:var(--cardt);border-radius:18px;overflow:hidden;display:grid;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.mcban{width:100%;aspect-ratio:16/9;object-fit:cover;background:#1a1433;display:block}
.mcban.ph{display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(135deg,#2a1f5c,#1a1433 40%,#4a1a2a)}
.mcbody{padding:12px 14px 14px;display:grid;gap:10px}
.mctop{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.mclogo{width:40px;height:40px;border-radius:50%;background:#0b0a18;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.mctitle{font-size:17px;font-weight:700;line-height:1.2}
.mcid{color:#12a89a;font-size:13px;font-weight:700}
.mcdate{font-size:12px;color:var(--carddim);margin-top:2px}
.mctime{font-size:12px;color:#b45309;font-weight:700;white-space:nowrap}
.mcstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mcstats div{background:#eef1f8;border-radius:12px;padding:8px 6px;text-align:center}
.mcstats span{display:block;font-size:10px;color:var(--carddim);font-weight:600;letter-spacing:.3px}
.mcstats b{display:block;font-size:16px;color:#e11d48;margin-top:2px}
.mcinfo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;text-align:center;color:var(--carddim)}
.mcinfo b{display:block;color:var(--cardt);font-size:14px;margin-top:2px}
.mcfoot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.mcfoot .bar{background:#e5e7eb}
.mcslot{font-size:12px;color:var(--carddim)}
.mcjoin{width:auto;min-width:96px;padding:10px 18px;background:var(--teal);color:#042;border-radius:12px;font-weight:700}
.balchip{background:rgba(255,201,74,.12);border:1px solid rgba(255,201,74,.35);color:var(--gold);padding:6px 12px;border-radius:20px;font-weight:700;font-size:14px}
/* Wallet */
.bal{padding:10px 0;border-bottom:1px solid var(--line)}.bal:last-child{border:0}
.bal b{font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips button{padding:10px 0}
.sheet{position:fixed;inset:0;background:rgba(5,3,15,.8);display:grid;align-items:end;z-index:20}
.sheet .card{border-radius:18px 18px 0 0;max-width:560px;width:100%;margin:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
/* Home modes */
.open{color:var(--ok);font-weight:700;white-space:nowrap;font-size:13px}
h2{font-size:20px;font-weight:700}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;scrollbar-width:none}
.car img{flex:0 0 100%;scroll-snap-align:start;width:100%;aspect-ratio:16/9;object-fit:cover}
.sts,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;display:grid;gap:4px;cursor:pointer;font-weight:700}
.sti{font-size:28px}
.gt{cursor:pointer;display:grid;gap:6px;text-align:center;font-weight:700;align-content:start}
.gt .ico{width:100%;height:auto;aspect-ratio:1;font-size:26px;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center}
.gt .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fab{position:fixed;right:16px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;text-decoration:none;color:var(--text);z-index:9}
/* Profile redesign */
.phead{text-align:center;display:grid;gap:6px;padding:8px 0 4px;position:relative}
.pedit{position:absolute;top:0;right:0;width:40px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;cursor:pointer;padding:0}
.pav{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#2a2150,var(--panel));border:3px solid var(--line);display:grid;place-items:center;font-size:40px;margin:0 auto;position:relative}
.phead .t{font-size:22px}
.phead .em{color:var(--dim);font-size:14px}
.phead .uid{color:var(--gold);font-size:13px;font-weight:700}
.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pstat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.pstat b{display:block;font-size:20px}
.pstat span{font-size:11px;color:var(--dim)}
.mrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.mrow .mi{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.mrow .ml{flex:1;font-weight:700}
.mrow .ar{color:var(--dim);font-size:18px}
.mrow.danger .ml{color:#ff6b6b}
.txbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px}
.txbox .tl{font-weight:700}
.txbox .ts{font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<header><h1>SM ARENA</h1><span class="balchip" id="coins"></span></header>
<main id="view"></main>
<nav id="nav" hidden>
<button data-tab="matches" class="on">Matches</button>
<button data-tab="rank">Leaderboard</button>
<button data-tab="me">Profile</button>
</nav>
<div class="sheet" id="wsheet" hidden>
 <div class="card">
  <div class="t" id="wstitle"></div>
  <div class="dim" id="wsnote"></div>
  <div class="chips" id="wchips"></div>
  <input id="wamt" type="number" inputmode="numeric" min="1" placeholder="Rakam (₹)">
  <div id="wpaybox" hidden>
   <img src="qr.png" alt="Payment QR" style="width:100%;max-width:240px;background:#fff;padding:8px;border-radius:10px;justify-self:center;display:block;margin:8px auto" onerror="this.style.display='none'">
   <div class="dim" style="text-align:center">Is QR se paise bhejo, phir neeche details bharo</div>
   <input id="wpn" placeholder="Payment karne wale ka naam" maxlength="60">
   <input id="wutr" placeholder="UTR number (12 ank)" inputmode="numeric" maxlength="14">
  </div>
  <div id="wserr" class="dim" style="color:var(--flame)"></div>
  <div class="two"><button class="ghost" id="wcancel">Band karo</button><button id="wok">Aage</button></div>
 </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getMessaging,getToken,isSupported}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,setPersistence,browserLocalPersistence,updateEmail,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,getCountFromServer,getDocs,writeBatch,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase console > Project settings > Your apps > Web app se config yahan paste karo
const cfg={apiKey:"AIzaSyD1-5WDFX-kv1RzNVgTVSqK4pkNbjGqCGk",authDomain:"sm-zone-aa784.firebaseapp.com",projectId:"sm-zone-aa784",messagingSenderId:"892451469784",appId:"1:892451469784:web:45b5cc8ef7d5264252daad"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const left=t=>{
  let s=Math.floor((t-Date.now())/1000);
  if(s<=0)return"Shuru";
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d)return `${d}d ${h}h`;
  if(h)return `${h}h ${m}m ${sec}s`;
  return `${m}m ${sec}s`;
};
const shortId=id=>(id||"").slice(-4).toUpperCase();
const inr=n=>(n<0?"-":"+")+"₹"+Math.abs(n);

// ---- Wallet helpers ----
// Stored on user doc as wallet: {w, d, b, tx:[{t,a,s,at}]}
function getWallet(p){
  const w=p&&p.wallet?p.wallet:{};
  return {
    w: typeof w.w==="number"?w.w:0,
    d: typeof w.d==="number"?w.d:0,
    b: typeof w.b==="number"?w.b:0,
    tx: Array.isArray(w.tx)?w.tx:[]
  };
}
function walletTotal(p){const W=getWallet(p);return (Number(W.w)||0)+(Number(W.d)||0)+(Number(W.b)||0)}
function rupee(n){n=Number(n);if(!Number.isFinite(n)||Math.abs(n)>1e7)return 0;return Math.round(n)}
async function saveWallet(W){
  if(!me)return;
  const total=W.w+W.d+W.b;
  await updateDoc(doc(db,"users",me.uid),{
    wallet:{w:W.w,d:W.d,b:W.b,tx:W.tx.slice(0,40)},
    coins:total // leaderboard ke liye total sync
  });
}
function logTx(W,t,a,s="Success"){W.tx.unshift({t,a,s,at:Date.now()});W.tx=W.tx.slice(0,40)}
async function allocSmid(){
 for(let i=0;i<25;i++){
  const n=String(1000+Math.floor(Math.random()*9000));
  try{
   const q=await getDocs(query(collection(db,"users"),where("smid","==",n),limit(1)));
   if(q.empty)return n;
  }catch(e){return n}
 }
 return String(Date.now()).slice(-4);
}

let me=null,profile=null,matches=[],ranks=[],tab="matches",subs=[],signup=false,forgot=false,cats=[],site={},curCat=null,pick=null,detail=null,wmode="",mFilter="upcoming",profPage=null;

function authErr(err){
 const code=(err&&err.code)||"";
 const msg=(err&&err.message)||String(err||"");
 const m={
  "auth/invalid-email":"Email sahi nahi hai.",
  "auth/user-not-found":"Is email ka account nahi mila. Naya account banao.",
  "auth/wrong-password":"Password galat hai.",
  "auth/invalid-credential":"Email ya password galat hai. (Naya user ho to pehle account banao)",
  "auth/invalid-login-credentials":"Email ya password galat hai.",
  "auth/email-already-in-use":"Ye email pehle se registered hai. Login karo.",
  "auth/weak-password":"Password kam se kam 6 akshar ka ho.",
  "auth/too-many-requests":"Bahut tries ho gayi. Thodi der baad try karo.",
  "auth/network-request-failed":"Internet check karo.",
  "auth/missing-email":"Pehle email likho.",
  "auth/operation-not-allowed":"Email/Password login Firebase console mein ON karo.",
  "auth/unauthorized-domain":"Is website domain ko Firebase Authorized domains mein add karo."
 };
 if(m[code])return m[code];
 if(/network|offline/i.test(msg))return"Internet check karo.";
 if(/password|credential|user-not-found/i.test(msg))return"Email ya password galat hai. Naya user ho to account banao.";
 return"Nahi hua: "+(code||msg||"unknown");
}

function authView(){
 $("#nav").hidden=true;$("#coins").textContent="";
 if(forgot){
  $("#view").innerHTML=`<form class="card" id="af">
   <div class="t">Password reset</div>
   <div class="dim">Apna registered email likho. Reset link email par jayega.</div>
   <input name="email" type="email" placeholder="Email" required>
   <p id="msg"></p>
   <button>Reset link bhejo</button>
   <button type="button" class="ghost" id="sw">Wapas login</button></form>`;
  $("#sw").onclick=()=>{forgot=false;signup=false;authView()};
  $("#af").onsubmit=async e=>{
   e.preventDefault();
   const email=new FormData(e.target).get("email").trim();
   const btn=e.target.querySelector("button");
   btn.disabled=true;
   try{
    await sendPasswordResetEmail(auth,email);
    $("#msg").textContent="Link bhej diya. Email (Spam bhi) check karo, link se naya password set karo.";
    $("#msg").style.color="var(--ok)";
   }catch(err){
    $("#msg").style.color="var(--flame)";
    $("#msg").textContent=authErr(err);
   }
   btn.disabled=false;
  };
  return;
 }
 $("#view").innerHTML=`<form class="card" id="af">
 ${signup?`<input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required>`:""}
 <input name="email" type="email" placeholder="Email" required>
 <input name="pw" type="password" placeholder="Password (kam se kam 6 akshar)" minlength="6" required>
 <p id="msg"></p><button>${signup?"Account banao":"Login karo"}</button>
 ${signup?"":`<button type="button" class="ghost" id="fp">Password bhool gaye?</button>`}
 <button type="button" class="ghost" id="sw">${signup?"Account hai? Login karo":"Naya account banao"}</button></form>`;
 $("#sw").onclick=()=>{signup=!signup;forgot=false;authView()};
 const fp=$("#fp");if(fp)fp.onclick=()=>{forgot=true;signup=false;authView()};
 $("#af").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  const btn=e.target.querySelector("button[type=submit],button:not([type])");
  if(btn){btn.disabled=true;btn.textContent="Ruko..."}
  $("#msg").textContent="";
  try{
   const email=String(f.get("email")||"").trim();
   const pw=String(f.get("pw")||"");
   if(!email||!pw){throw{code:"auth/missing-email"}}
   if(signup){const u=await createUserWithEmailAndPassword(auth,email,pw);
    const smid=await allocSmid();
    await setDoc(doc(db,"users",u.user.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),smid,coins:5,wallet:{w:0,d:0,b:5,tx:[{t:"Welcome Bonus",a:5,s:"Success",at:Date.now()}]}});}
   else await signInWithEmailAndPassword(auth,email,pw);
   // onAuthStateChanged app khol dega
  }catch(err){
   console.error("auth error",err);
   $("#msg").textContent=authErr(err);
   if(btn){btn.disabled=false;btn.textContent=signup?"Account banao":"Login karo"}
  }};
}

function profileView(){
 $("#nav").hidden=true;
 $("#view").innerHTML=`<form class="card" id="pf"><div class="t">Profile poora karo</div><input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required><button>Save karo</button><button type="button" class="ghost" id="po">Logout</button></form>`;
 $("#po").onclick=()=>signOut(auth);
 $("#pf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{
   const smid=await allocSmid();
   await setDoc(doc(db,"users",me.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),smid,coins:5,wallet:{w:0,d:0,b:5,tx:[{t:"Welcome Bonus",a:5,s:"Success",at:Date.now()}]}});
   location.reload()
  }catch(err){alert("Nahi hua: "+(err.code||err.message))}};
}

let authGen=0;
$("#view").innerHTML=`<p class="dim" style="text-align:center;padding:40px">Load ho raha hai...</p>`;
onAuthStateChanged(auth,async u=>{
 const gen=++authGen;
 subs.forEach(f=>f());subs=[];

async function confirmPick(viaWallet,ign,ffUid){
 const{id,sel}=pick;
 const m=pick.m;
 const useIgn=(ign||profile.ign||"").trim();
 const useUid=(ffUid||profile.ffUid||"").trim();
 if(!useIgn||!useUid){alert("Gaming naam aur UID dono zaroori hain.");return}
 try{
  if(m.fee>0 && viaWallet){
   const W=getWallet(profile);
   if(W.w+W.d+W.b < m.fee){alert("Wallet balance kam hai. Pehle Profile mein Add Cash karo.");return}
   // Order: Deposit → Bonus → Winning
   let r=m.fee;
   const fromD=Math.min(W.d,r); W.d-=fromD; r-=fromD;
   const fromB=Math.min(W.b,r); W.b-=fromB; r-=fromB;
   if(r>0) W.w-=r;
   logTx(W, "Match fee: "+(m.title||"Match"), -m.fee);
   // Fee katna aur slot book karna ek hi batch mein: ya to dono hote hain, ya koi nahi
   const b=writeBatch(db);
   b.update(doc(db,"users",me.uid),{wallet:{w:W.w,d:W.d,b:W.b,tx:W.tx.slice(0,40)},coins:W.w+W.d+W.b,lastJoin:id});
   b.set(doc(db,"matches",id,"slots",String(sel)),{uid:me.uid});
   b.set(doc(db,"matches",id,"players",me.uid),{ign:useIgn,ffUid:useUid,at:Date.now(),slot:sel,paid:true,paidVia:"wallet"});
   await b.commit();
  }else if(m.fee>0){
   alert("Is match ki fee wallet se hi bhari ja sakti hai.");return
  }else{
   // Free match
   const b=writeBatch(db);
   b.set(doc(db,"matches",id,"slots",String(sel)),{uid:me.uid});
   b.set(doc(db,"matches",id,"players",me.uid),{ign:useIgn,ffUid:useUid,at:Date.now(),slot:sel});
   await b.commit();
  }
  pick=null;await load(matches);
 }catch(err){
  if(err.code=="permission-denied"){alert("Ye slot kisi aur ne le liya ya join nahi ho paya. Dobara slot chuno.");pick.taken=await slotsTaken(id);pick.sel=null;pick.step=null;draw()}
  else alert("Nahi hua: "+(err.code||err.message));
 }
}

    btn.disabled=false;btn.textContent="Save karo";
   }
  };
  return;
 }

let wstep=1; // 1=amount, 2=details
function openWalletSheet(m){
 wmode=m; wstep=1;
 $("#wstitle").textContent=m==="add"?"Add Cash":"Withdraw";
 $("#wsnote").textContent=m==="add"
  ?"Pehle rakam chuno. Phir QR se paise bhejkar UTR bharna hoga. Admin confirm karega tab Deposit me aayega."
  :"Winning balance se nikaalo. UPI ID do — admin pay karega phir confirm karega.";
 $("#wchips").innerHTML=[10,50,100,500].map(n=>`<button class="ghost" data-n="${n}">₹${n}</button>`).join("");
 $("#wamt").value="";$("#wserr").textContent="";
 $("#wpaybox").hidden=true; $("#wpn").value=""; $("#wutr").value="";
 $("#wpn").placeholder=m==="add"?"Payment karne wale ka naam":"Account / naam";
 $("#wutr").placeholder=m==="add"?"UTR number (12 ank)":"UPI ID (jaise name@paytm)";
 $("#wutr").removeAttribute("inputmode");
 if(m==="add")$("#wutr").setAttribute("inputmode","numeric");
 const qimg=$("#wpaybox img");if(qimg)qimg.style.display=m==="add"?"":"none";
 const qnote=$("#wpaybox .dim");if(qnote)qnote.style.display=m==="add"?"":"none";
 $("#wok").textContent="Aage";
 $("#wsheet").hidden=false;
}

async function doWalletAction(){
 const n=Math.floor(+$("#wamt").value);
 const W=getWallet(profile);
 let err="";
 if(wmode==="add"){
  if(wstep===1){
   if(!(n>=1&&n<=10000)){err="₹1 se ₹10000 ke beech rakam likho.";$("#wserr").textContent=err;return}
   wstep=2;
   $("#wsnote").textContent="₹"+n+" is QR se bhejo, phir naam aur UTR likho.";
   $("#wpaybox").hidden=false;
   $("#wok").textContent="Request bhejo";
   $("#wserr").textContent="";
   return;
  }
  const nm=($("#wpn").value||"").trim();
  const ut=($("#wutr").value||"").replace(/\s/g,"");
  if(!nm){err="Pehle payment karne wale ka naam likho.";$("#wserr").textContent=err;return}
  if(!/^\d{12}$/.test(ut)){err="UTR 12 ank ka hona chahiye (sirf number).";$("#wserr").textContent=err;return}
  try{
   await addDoc(collection(db,"deposits"),{
     uid:me.uid, ign:profile.ign||"", ffUid:profile.ffUid||"",
     amount:n, payerName:nm, utr:ut,
     status:"pending", at:Date.now()
   });
   logTx(W,"Add Cash request ₹"+n+" (pending)",0,"Pending");
   try{await saveWallet(W)}catch(e){}
   $("#wsheet").hidden=true;
   alert("Request bhej di. Admin confirm karega tab Deposit balance me ₹"+n+" aa jayega.");
   if(tab==="me")draw();
  }catch(e){alert("Nahi hua: "+(e.code||e.message))}
  return;
 }
 // withdraw
 if(wstep===1){
  if(!(n>=10&&n<=100000)){err="₹10 se ₹1,00,000 ke beech rakam likho.";$("#wserr").textContent=err;return}
  if(n>W.w){err="Winning balance mein sirf ₹"+W.w+" hai.";$("#wserr").textContent=err;return}
  wstep=2;
  $("#wsnote").textContent="₹"+n+" kahan bhejna hai? UPI ID aur naam likho.";
  $("#wpaybox").hidden=false;
  $("#wpaybox").querySelector("img")&&($("#wpaybox").querySelector("img").style.display="none");
  $("#wok").textContent="Request bhejo";
  $("#wserr").textContent="";
  return;
 }
 const nm=($("#wpn").value||"").trim();
 const upi=($("#wutr").value||"").trim();
 if(!nm){err="Account / naam likho.";$("#wserr").textContent=err;return}
 if(!upi||upi.length<5){err="Sahi UPI ID likho.";$("#wserr").textContent=err;return}
 if(n>W.w){err="Winning balance mein sirf ₹"+W.w+" hai.";$("#wserr").textContent=err;return}
 try{
  W.w-=n;
  logTx(W,"Withdraw request ₹"+n+" (pending)",-n,"Pending");
  await saveWallet(W);
  await addDoc(collection(db,"withdrawals"),{
    uid:me.uid, ign:profile.ign||"", ffUid:profile.ffUid||"",
    amount:n, accountName:nm, upi:upi,
    status:"pending", at:Date.now()
  });
  $("#wsheet").hidden=true;
  alert("Withdraw request bhej di. Admin pay karke confirm karega.");
  if(tab==="me")draw();
 }catch(e){alert("Nahi hua: "+(e.code||e.message))}
}

const maskUid=s=>{s=String(s||"");return s.length>4?"••••"+s.slice(-4):s};
const tierOf=i=>i<3?"GOLD":i<10?"SILVER":"BRONZE";
const rankScore=u=>{const W=getWallet(u);return rupee(u.wallet?W.w+W.d+W.b:u.coins)};
const isMine=u=>!!(profile&&String(u.ffUid)===String(profile.ffUid));
const podOf=(u,i,cls)=>u?`<div class="pod ${cls}${isMine(u)?" me":""}"><div class="pr">${i+1}</div><div class="pt">${tierOf(i)}</div><div class="pn">${esc(u.ign)}</div><div class="pu">SMID ${esc(u.smid||"—")}</div><div class="ps">${rankScore(u)}</div></div>`:`<div class="pod ${cls} empty"></div>`;
const rankRow=(u,i)=>`<div class="rk${isMine(u)?" me":""}"><div class="rn">${i+1}</div><div class="ri"><div class="t">${esc(u.ign)}</div><div class="dim">SMID ${esc(u.smid||"—")} · ${tierOf(i)}</div></div><div class="ps">${rankScore(u)}</div></div>`;
function rankView(){
 if(!ranks.length)return`<p class="dim">Abhi leaderboard khali hai.</p>`;
 const my=ranks.findIndex(isMine);
 return`<div class="crown">👑</div><div class="pods">${podOf(ranks[1],1,"p2")}${podOf(ranks[0],0,"p1")}${podOf(ranks[2],2,"p3")}</div>`
  +`<div class="notice">${my>=0?"Aapka rank: #"+(my+1):"Aap abhi top "+ranks.length+" mein nahi ho."}</div>`
  +ranks.slice(3).map((u,k)=>rankRow(u,k+3)).join("");
}

function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 const v=$("#view");
 if(tab=="matches"&&document.activeElement&&document.activeElement.matches("#view .payer input"))return;
 if(pick&&tab=="matches")return slotView(v);
 if(detail&&tab=="matches")return detailView(v);
 if(tab=="matches"){
  if(curCat===null){
   v.innerHTML=home();
  }else{
   // Mode ya status select ke baad: naya card UI
   let list;
   if(curCat[0]==="@"){
    const st=curCat.slice(1);
    list=matches.filter(m=>m.status===st&&vis(m));
    mFilter=st==="live"?"live":st==="done"?"done":"upcoming";
   }else{
    const byCat=matches.filter(m=>inCat(m,curCat));
    const filt=mFilter==="live"?m=>m.status==="live":mFilter==="done"?m=>m.status==="done":m=>m.status!=="live"&&m.status!=="done";
    list=byCat.filter(filt).filter(m=>mFilter==="done"?vis(m):m.status!=="done"||vis(m));
   }
   const catName=curCat[0]==="@"?{upcoming:"Upcoming",live:"Ongoing",done:"Results"}[curCat.slice(1)]||curCat:(cats.find(c=>c.id==curCat)||{name:curCat||"Other"}).name;
   v.innerHTML=`<button class="ghost" data-back>‹ Home</button>
   <div class="t">${esc(catName)}</div>
   ${curCat[0]==="@"?"":`<div class="mtabs">
    <button data-mf="live" class="${mFilter=="live"?"on":""}">Ongoing</button>
    <button data-mf="upcoming" class="${mFilter=="upcoming"?"on":""}">Upcoming</button>
    <button data-mf="done" class="${mFilter=="done"?"on":""}">Results</button>
   </div>`}
   ${list.length?list.map(card).join(""):`<p class="dim" style="text-align:center;padding:24px">Yahan abhi koi match nahi.</p>`}`;
  }
 }
 if(tab=="rank")v.innerHTML=rankView();
 if(tab=="me")meView(v);
}

$("#nav").onclick=e=>{document.activeElement&&document.activeElement.blur();const b=e.target.closest("button");if(b){if(b.dataset.tab=="matches"&&tab=="matches"){curCat=null;pick=null;detail=null}if(b.dataset.tab!=="me")profPage=null;tab=b.dataset.tab;draw()}};
$("#view").onclick=async e=>{
 if(e.target.closest("button")&&document.activeElement)document.activeElement.blur();
 const cp=e.target.closest("[data-copytext]");
 if(cp){
  const t=cp.dataset.copytext||"";
  try{await navigator.clipboard.writeText(t);cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy",1200)}
  catch(err){prompt("Copy karo:",t)}
  return;
 }
 const mf=e.target.closest("[data-mf]");if(mf){mFilter=mf.dataset.mf;pick=null;detail=null;draw();return}
 if(e.target.closest("[data-dback]")){detail=null;draw();return}
 const dt=e.target.closest("[data-dtab]");if(dt&&detail){detail.tab=dt.dataset.dtab;draw();return}
 const op=e.target.closest("[data-open]");if(op&&!e.target.closest("button")){await openDetail(op.dataset.open);return}
 if(e.target.closest("[data-pickback]")){pick=null;draw();return}
 if(e.target.closest("[data-pickback-details]")&&pick){pick.step=null;draw();return}
 const sb=e.target.closest("[data-slot]");if(sb&&pick){pick.sel=+sb.dataset.slot;pick.step=null;draw();return}
 if(e.target.closest("[data-pickgo-wallet]")&&pick){pick.step="details";draw();return}
 if(e.target.closest("[data-pickconfirm]")&&pick){
  const ign=($("#pickIgn")?.value||"").trim();
  const uid=($("#pickUid")?.value||"").trim();
  const err=$("#pickErr");
  if(!ign){if(err)err.textContent="Free Fire naam (IGN) likho.";return}
  if(!uid||!/^\d{5,20}$/.test(uid)){if(err)err.textContent="Sahi Free Fire UID likho (sirf number).";return}
  if(err)err.textContent="";
  const btn=e.target.closest("[data-pickconfirm]");
  if(btn){btn.disabled=true;btn.textContent="Ruko..."}
  await confirmPick(true,ign,uid);
  return;
 }
 if(e.target.closest("[data-pickgo]")&&pick){await confirmPick(false);return}
 if(e.target.closest("[data-back]")){curCat=null;pick=null;detail=null;draw();return}
 const ct=e.target.closest("[data-cat]");if(ct){curCat=ct.dataset.cat;mFilter=curCat==="@live"?"live":curCat==="@done"?"done":"upcoming";pick=null;detail=null;draw();return}
 const b=e.target.closest("button[data-join],button[data-leave],button[data-room]");if(!b)return;
 const d=b.dataset,pl=id=>doc(db,"matches",id,"players",me.uid);
 try{
  if(d.join){await openPick(d.join)}
  else if(d.leave){await deleteDoc(pl(d.leave));await load(matches)}
  else{const s=await getDoc(doc(db,"matches",d.room,"secret","room")),x=$("#r"+d.room);
   if(s.exists()&&s.data().id){
    const rid=s.data().id,rpass=s.data().pass||"";
    x.innerHTML=`<div class="room">
     <div class="rline"><span>Room ID: <b>${esc(rid)}</b></span><button type="button" class="rcopy" data-copytext="${esc(rid)}">Copy</button></div>
     <div class="rline"><span>Password: <b>${esc(rpass)}</b></span><button type="button" class="rcopy" data-copytext="${esc(rpass)}">Copy</button></div>
    </div>`;
   }else x.innerHTML=`<p class="dim" style="color:#6b7280">Room ID abhi admin ne nahi daala.</p>`;
  }
 }catch(err){alert("Nahi hua: "+(err.code||err.message))}
};
