<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<title>FF Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14112b;--panel:#211c44;--line:#3a3270;--text:#efeaff;--dim:#a79fd0;--flame:#ff6a3d;--gold:#ffc94a;--ok:#35d08a}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:500 17px/1.4 Rajdhani,system-ui,sans-serif;padding:0 0 84px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;max-width:560px;margin:auto}
h1{font-size:28px;font-weight:700}
main{display:grid;gap:14px;padding:0 16px;max-width:560px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dim{color:var(--dim)}.coins{color:var(--gold);font-weight:700}.ok{color:var(--ok);font-weight:700}
.t{font-size:21px;font-weight:700}
.cd{font-size:34px;font-weight:700;color:var(--flame);line-height:1}
button{font:700 17px Rajdhani,sans-serif;background:var(--flame);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45}
input{font:500 17px Rajdhani,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.room{background:var(--bg);border:1px dashed var(--gold);border-radius:10px;padding:10px;display:grid;gap:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--dim);border-radius:0;padding:16px 0}
nav button.on{color:var(--flame);box-shadow:inset 0 3px var(--flame)}
#msg{color:var(--flame)}
.ico{position:relative;width:56px;height:56px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-weight:700;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.open{color:#35d08a;font-weight:700;white-space:nowrap}
h2{font-size:22px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--flame)}
.payer{display:grid;gap:6px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rules{padding-left:18px;display:grid;gap:6px}
.dban{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.tabs button.on{background:var(--flame);border-color:var(--flame);color:#fff}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sl{padding:12px 0;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.sl.on{background:var(--flame);border-color:var(--flame);color:#fff}
.sl:disabled{opacity:.35;text-decoration:line-through}
.notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;scrollbar-width:none}
.car img{flex:0 0 100%;scroll-snap-align:start;width:100%;aspect-ratio:16/9;object-fit:cover}
.sts,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;display:grid;gap:4px;cursor:pointer;font-weight:700}
.sti{font-size:30px}
.gt{cursor:pointer;display:grid;gap:4px;text-align:center;font-weight:700;align-content:start}
.gt .ico{width:100%;height:auto;aspect-ratio:1;font-size:28px}
.fab{position:fixed;right:16px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;text-decoration:none}
/* Wallet styles */
.bal{padding:10px 0;border-bottom:1px solid var(--line)}.bal:last-child{border:0}
.bal b{font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips button{padding:10px 0}
.sheet{position:fixed;inset:0;background:rgba(5,3,15,.75);display:grid;align-items:end;z-index:20}
.sheet .card{border-radius:18px 18px 0 0;max-width:560px;width:100%;margin:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
</style>
</head>
<body>
<header><h1>FF Arena</h1><span class="coins" id="coins"></span></header>
<main id="view"></main>
<nav id="nav" hidden>
<button data-tab="matches" class="on">Matches</button>
<button data-tab="rank">Leaderboard</button>
<button data-tab="me">Profile</button>
</nav>
<div class="sheet" id="wsheet" hidden>
 <div class="card">
  <div class="t" id="wstitle"></div>
  <div class="dim" id="wsnote"></div>
  <div class="chips" id="wchips"></div>
  <input id="wamt" type="number" inputmode="numeric" min="1" placeholder="Rakam (₹)">
  <div id="wpaybox" hidden>
   <img src="qr.png" alt="Payment QR" style="width:100%;max-width:240px;background:#fff;padding:8px;border-radius:10px;justify-self:center;display:block;margin:8px auto" onerror="this.style.display='none'">
   <div class="dim" style="text-align:center">Is QR se paise bhejo, phir neeche details bharo</div>
   <input id="wpn" placeholder="Payment karne wale ka naam" maxlength="60">
   <input id="wutr" placeholder="UTR number (12 ank)" inputmode="numeric" maxlength="14">
  </div>
  <div id="wserr" class="dim" style="color:var(--flame)"></div>
  <div class="two"><button class="ghost" id="wcancel">Band karo</button><button id="wok">Aage</button></div>
 </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getMessaging,getToken,isSupported}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,deleteDoc,onSnapshot,query,orderBy,limit,getCountFromServer,getDocs,writeBatch,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase console > Project settings > Your apps > Web app se config yahan paste karo
const cfg={apiKey:"AIzaSyD1-5WDFX-kv1RzNVgTVSqK4pkNbjGqCGk",authDomain:"sm-zone-aa784.firebaseapp.com",projectId:"sm-zone-aa784",messagingSenderId:"892451469784",appId:"1:892451469784:web:45b5cc8ef7d5264252daad"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const left=t=>{let m=Math.round((t-Date.now())/6e4);if(m<=0)return"Shuru";const d=Math.floor(m/1440),h=Math.floor(m%1440/60);m%=60;return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`};
const inr=n=>(n<0?"-":"+")+"₹"+Math.abs(n);

// ---- Wallet helpers ----
// Stored on user doc as wallet: {w, d, b, tx:[{t,a,s,at}]}
function getWallet(p){
  const w=p&&p.wallet?p.wallet:{};
  return {
    w: typeof w.w==="number"?w.w:0,
    d: typeof w.d==="number"?w.d:0,
    b: typeof w.b==="number"?w.b:0,
    tx: Array.isArray(w.tx)?w.tx:[]
  };
}
function walletTotal(p){const W=getWallet(p);return W.w+W.d+W.b}
async function saveWallet(W){
  if(!me)return;
  const total=W.w+W.d+W.b;
  await updateDoc(doc(db,"users",me.uid),{
    wallet:{w:W.w,d:W.d,b:W.b,tx:W.tx.slice(0,40)},
    coins:total // leaderboard ke liye total sync
  });
}
function logTx(W,t,a,s="Success"){W.tx.unshift({t,a,s,at:Date.now()});W.tx=W.tx.slice(0,40)}

let me=null,profile=null,matches=[],ranks=[],tab="matches",subs=[],signup=false,cats=[],site={},curCat=null,pick=null,detail=null,wmode="";

function authView(){
 $("#nav").hidden=true;$("#coins").textContent="";
 $("#view").innerHTML=`<form class="card" id="af">
 ${signup?`<input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required>`:""}
 <input name="email" type="email" placeholder="Email" required>
 <input name="pw" type="password" placeholder="Password (kam se kam 6 akshar)" minlength="6" required>
 <p id="msg"></p><button>${signup?"Account banao":"Login karo"}</button>
 <button type="button" class="ghost" id="sw">${signup?"Account hai? Login karo":"Naya account banao"}</button></form>`;
 $("#sw").onclick=()=>{signup=!signup;authView()};
 $("#af").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{
   if(signup){const u=await createUserWithEmailAndPassword(auth,f.get("email"),f.get("pw"));
    await setDoc(doc(db,"users",u.user.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),coins:5,wallet:{w:0,d:0,b:5,tx:[{t:"Welcome Bonus",a:5,s:"Success",at:Date.now()}]}});}
   else await signInWithEmailAndPassword(auth,f.get("email"),f.get("pw"));
  }catch(err){$("#msg").textContent="Nahi hua: "+(err.code||err.message)}};
}

function profileView(){
 $("#nav").hidden=true;
 $("#view").innerHTML=`<form class="card" id="pf"><div class="t">Profile poora karo</div><input name="ign" placeholder="Free Fire naam (IGN)" required><input name="ffUid" placeholder="Free Fire UID" inputmode="numeric" required><button>Save karo</button><button type="button" class="ghost" id="po">Logout</button></form>`;
 $("#po").onclick=()=>signOut(auth);
 $("#pf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{await setDoc(doc(db,"users",me.uid),{ign:f.get("ign").trim(),ffUid:f.get("ffUid").trim(),coins:5,wallet:{w:0,d:0,b:5,tx:[{t:"Welcome Bonus",a:5,s:"Success",at:Date.now()}]}});location.reload()}catch(err){alert("Nahi hua: "+(err.code||err.message))}};
}

onAuthStateChanged(auth,async u=>{
 subs.forEach(f=>f());subs=[];me=u;profile=null;
 if(!u)return authView();
 // naya account: profile doc banne ka thoda wait
 for(let i=0;i<5&&!profile;i++){const s=await getDoc(doc(db,"users",u.uid));if(s.exists())profile=s.data();else await new Promise(r=>setTimeout(r,500))}
 if(!profile)return profileView();
 $("#nav").hidden=false;
 subs.push(onSnapshot(query(collection(db,"categories"),orderBy("order")),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 subs.push(onSnapshot(doc(db,"categories","home"),s=>{site=s.exists()?s.data():{};draw()}));
 subs.push(onSnapshot(doc(db,"users",u.uid),s=>{
  profile=s.data()||{};
  // migrate old profiles that have no wallet
  if(!profile.wallet){
   const c=typeof profile.coins==="number"?profile.coins:0;
   profile.wallet={w:0,d:c,b:0,tx:c?[{t:"Migrated balance",a:c,s:"Success",at:Date.now()}]:[]};
   updateDoc(doc(db,"users",u.uid),{wallet:profile.wallet,coins:c}).catch(()=>{});
  }
  $("#coins").textContent="₹"+walletTotal(profile);
  if(tab=="me")draw();
 }));
 subs.push(onSnapshot(query(collection(db,"matches"),orderBy("startTime","desc"),limit(30)),s=>load(s.docs.map(d=>({id:d.id,...d.data()})))));
 subs.push(onSnapshot(query(collection(db,"users"),orderBy("coins","desc"),limit(20)),s=>{ranks=s.docs.map(d=>d.data());if(tab=="rank")draw()}));
});

async function load(list){
 await Promise.all(list.map(async m=>{
  const[p,c]=await Promise.all([getDoc(doc(db,"matches",m.id,"players",me.uid)),getCountFromServer(collection(db,"matches",m.id,"slots"))]);
  m.joined=p.exists();m.paid=p.exists()&&p.data().paid===true;m.paidVia=p.exists()?p.data().paidVia||"":"";m.payerName=p.exists()?p.data().payerName||"":"";m.utr=p.exists()?p.data().utr||"":"";m.slot=p.exists()?p.data().slot:null;m.want=p.exists()?p.data().want:null;m.count=c.data().count}));
 matches=list;draw();
}

const vis=m=>m.status!="done"||Date.now()-(m.doneAt||m.startTime)<1728e5;
const inCat=(m,c)=>c===""?!cats.some(x=>x.id==m.cat):m.cat==c;
const catRow=(id,c,list)=>{
 const up=list.filter(m=>m.status=="upcoming"),o=up.filter(m=>m.count<m.slots).length;
 return`<div class="card" data-cat="${esc(id)}" style="grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;cursor:pointer"><div class="ico">${c.img?`<img src="${esc(c.img)}" alt="" onerror="this.remove()">`:""}${esc(c.name.slice(0,2).toUpperCase())}</div><div><div class="t">${esc(c.name)}</div><div class="dim">${up.length} upcoming tournaments</div></div><div class="open">${o?"● "+o+" open":""}</div><span class="dim">›</span></div>`};
const tile=(id,c,list)=>{const o=list.filter(m=>m.status=="upcoming"&&m.count<m.slots).length;
 return`<div class="gt" data-cat="${esc(id)}"><div class="ico">${c.img?`<img src="${esc(c.img)}" alt="" onerror="this.remove()">`:""}${esc(c.name.slice(0,2).toUpperCase())}</div><div>${esc(c.name)}</div><div class="open">${o?"● "+o+" open":"&nbsp;"}</div></div>`};
const home=()=>{
 const n=s=>matches.filter(m=>m.status==s&&vis(m)).length;
 const st=(k,ic,t)=>`<div class="st" data-cat="@${k}"><div class="sti">${ic}</div><div>${t}</div><div class="dim">${n(k)}</div></div>`;
 const bn=(site.banners||[]).map(b=>`<img src="${esc(b)}" alt="" onerror="this.remove()">`).join("");
 const oth=matches.filter(m=>inCat(m,"")&&m.status!="done");
 const g=cats.map(c=>tile(c.id,c,matches.filter(m=>m.cat==c.id))).concat(oth.length?[tile("",{name:"Other"},oth)]:[]).join("");
 return soon()+(site.notice?`<div class="notice">📢 ${esc(site.notice)}</div>`:"")+(bn?`<div class="car" id="car">${bn}</div>`:"")+`<div class="sts">${st("upcoming","📅","Upcoming")}${st("live","🔴","Ongoing")}${st("done","🏆","Completed")}</div><h2>All Modes</h2>${g?`<div class="grid">${g}</div>`:`<p class="dim">Abhi koi mode nahi hai. Thodi der baad dekho.</p>`}`+(/^https?:\/\//.test(site.support||"")?`<a class="fab" href="${esc(site.support)}" target="_blank" rel="noopener">💬</a>`:"")};
const soon=()=>matches.filter(m=>m.joined&&(!m.fee||m.paid)&&m.status=="upcoming"&&m.startTime-Date.now()<9e5&&m.startTime-Date.now()>-36e5).map(m=>{const mn=Math.round((m.startTime-Date.now())/6e4);return`<div class="notice" data-open="${m.id}" style="cursor:pointer">⏰ ${esc(m.title)} ${mn>0?mn+" min mein shuru hoga":"abhi shuru ho raha hai"}. Details dekho.</div>`}).join("");
async function enablePush(){
 const st=$("#pushmsg");
 try{
  if(typeof Notification=="undefined"||!(await isSupported())){st.textContent="Is browser mein notification support nahi hai.";return}
  if(!site.vapidKey){st.textContent="Admin ne abhi notification chalu nahi kiya.";return}
  if(await Notification.requestPermission()!="granted"){st.textContent="Ijazat nahi mili. Browser ki site settings mein notification allow karo.";return}
  const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  const tok=await getToken(getMessaging(app),{vapidKey:site.vapidKey,serviceWorkerRegistration:reg});
  st.textContent=tok?"Notification chalu ho gaya hai.":"Token nahi mila, dobara try karo.";
 }catch(e){st.textContent="Nahi hua: "+(e.code||e.message)}
}
const medal=i=>["🥇","🥈","🥉"][i]||"🏅";
const row=(a,b)=>`<div class="rw"><span class="dim">${a}</span><b>${b}</b></div>`;
const rankRows=m=>{
 const r=String(m.ranks||"").split(",").map(x=>x.split(":")).filter(x=>x.length==2&&x[1].trim());
 return(r.length?r:[["1",String(m.prizeInr||0)]]).map((x,i)=>`<div class="rw"><span>${medal(i)} Rank ${esc(x[0].trim())}</span><b class="coins">₹${esc(x[1].trim())}</b></div>`).join("");
};
const defRules=["Free Fire ka sahi IGN daalo. Baad mein badla nahi jayega.","Sirf apne diye gaye slot mein baitho.","Room ID aur password kisi ko share mat karo.","Hack, mod, teaming ya emulator ka use mana hai.","Match ki screen recording rakho, shikayat ke liye zaroori hai.","Admin ka faisla final hoga."];
const rulesList=()=>{const t=String(site.rules||"").split("\n").map(x=>x.trim()).filter(Boolean);return(t.length?t:defRules).map(x=>`<li>${esc(x)}</li>`).join("")};
async function openDetail(id){
 const m=matches.find(x=>x.id==id);
 detail={id,tab:"desc",room:null,members:null};draw();
 const d=detail;
 if(m.joined&&(!m.fee||m.paid)&&m.status!="done"){try{const s=await getDoc(doc(db,"matches",id,"secret","room"));if(s.exists())d.room=s.data()}catch(e){}}
 try{d.members=(await getDocs(collection(db,"matches",id,"players"))).docs.map(p=>p.data()).filter(p=>p.slot).sort((a,b)=>a.slot-b.slot)}catch(e){d.members=[]}
 if(detail===d)draw();
}
function detailView(v){
 const m=matches.find(x=>x.id==detail.id);if(!m){detail=null;return draw()}
 const ok=m.joined&&(!m.fee||m.paid)&&m.status!="done";
 const room=ok?(detail.room&&detail.room.id?row("Room ID",esc(detail.room.id))+row("Password",esc(detail.room.pass)):`<p class="dim">Room ID abhi admin ne nahi diya.</p>`):`<p class="dim">${m.joined?"Fee confirm hone ke baad Room ID dikhega.":"Match join karo, tab Room ID dikhega."}</p>`;
 const desc=`<div class="card"><div class="t">🎮 Room Details</div>${room}</div>
 <div class="card"><div class="t">Match Details</div>${row("Type",esc(m.mode))}${row("Map",esc(m.map))}${row("Entry fee",m.fee?"₹"+m.fee:"Free")}${row("Total prize","₹"+(m.prizeInr||0))}${row("Per kill","₹"+(m.perKill||0))}${row("Time",esc(new Date(m.startTime).toLocaleString()))}${row("Slots",m.count+"/"+m.slots)}</div>
 <div class="card"><div class="t">Top Rank Prize Details</div>${rankRows(m)}</div>
 <div class="card"><div class="t">📜 Rules &amp; Guidelines</div><ul class="rules">${rulesList()}</ul></div>`;
 const mem=detail.members===null?`<p class="dim">Load ho raha hai...</p>`:detail.members.length?`<div class="card">${detail.members.map(p=>`<div class="rw"><span>#${p.slot} ${esc(p.ign)}</span></div>`).join("")}</div>`:`<p class="dim">Abhi koi member nahi.</p>`;
 v.innerHTML=`<button class="ghost" data-dback>‹ Wapas</button>${m.banner?`<img class="dban" src="${esc(m.banner)}" alt="" onerror="this.remove()">`:""}<div class="t">${esc(m.title)}</div><div class="tabs"><button class="${detail.tab=="desc"?"on":""}" data-dtab="desc">Description</button><button class="${detail.tab=="mem"?"on":""}" data-dtab="mem">Members (${m.count}/${m.slots})</button></div>${detail.tab=="desc"?desc:mem}`;
}
const slotsTaken=async id=>new Set((await getDocs(collection(db,"matches",id,"slots"))).docs.map(d=>d.id));
async function openPick(id){
 const m=matches.find(x=>x.id==id);
 pick={id,m,taken:await slotsTaken(id),sel:null};draw();
}
function slotView(v){
 const{m,taken,sel}=pick;
 const W=getWallet(profile);
 const canWallet=m.fee>0 && (W.d+W.b)>=m.fee;
 const btns=Array.from({length:m.slots},(x,i)=>{const n=i+1;return`<button class="sl${sel==n?" on":""}" data-slot="${n}" ${taken.has(String(n))?"disabled":""}>${n}</button>`}).join("");
 v.innerHTML=`<button class="ghost" data-pickback>‹ Wapas</button><div class="card"><div class="t">Slot chuno</div><div class="dim">${esc(m.title)}</div><div class="slots">${btns}</div><div class="dim">Total ${m.slots} slot, booked: ${taken.size}</div>
 ${m.fee?`<div class="dim">Fee ₹${m.fee}. Wallet balance: ₹${W.d+W.b} (Deposit ₹${W.d} + Bonus ₹${W.b})</div>`:""}
 </div>
 ${sel? (m.fee>0 ? `<div class="card"><div class="t">Payment tarika</div>
  <button data-pickgo-wallet ${canWallet?"":"disabled"}>${canWallet?"Wallet se pay karo (₹"+m.fee+")":"Wallet balance kam hai"}</button>
  <button class="ghost" data-pickgo-upi>UPI se bhejo (admin confirm karega)</button>
  <div class="dim">Wallet se pay karne par slot turant book ho jata hai. UPI me admin fee confirm karega.</div>
 </div>` : `<button data-pickgo ${sel?"":"disabled"}>Match join karo (free)</button>`)
 : `<button disabled>Pehle slot chuno</button>`}`;
}
async function confirmPick(viaWallet){
 const{id,sel}=pick;
 const m=pick.m;
 try{
  if(m.fee>0 && viaWallet){
   // Wallet se turant pay + slot book
   const W=getWallet(profile);
   if(W.d+W.b < m.fee){alert("Wallet balance kam hai. Pehle Add Cash karo ya UPI se bhejo.");return}
   let r=m.fee, fromD=Math.min(W.d,r); W.d-=fromD; r-=fromD; W.b-=r;
   logTx(W, "Match fee: "+(m.title||"Match"), -m.fee);
   await saveWallet(W);
   const b=writeBatch(db);
   b.set(doc(db,"matches",id,"slots",String(sel)),{uid:me.uid});
   b.set(doc(db,"matches",id,"players",me.uid),{
     ign:profile.ign, ffUid:profile.ffUid, at:Date.now(),
     slot:sel, paid:true, paidVia:"wallet", want:sel
   });
   await b.commit();
  }else if(m.fee>0){
   // UPI flow – only reserve want, admin will confirm paid
   await setDoc(doc(db,"matches",id,"players",me.uid),{ign:profile.ign,ffUid:profile.ffUid,at:Date.now(),want:sel,paidVia:"upi"});
  }else{
   // Free match
   const b=writeBatch(db);
   b.set(doc(db,"matches",id,"slots",String(sel)),{uid:me.uid});
   b.set(doc(db,"matches",id,"players",me.uid),{ign:profile.ign,ffUid:profile.ffUid,at:Date.now(),slot:sel});
   await b.commit();
  }
  pick=null;await load(matches);
 }catch(err){
  if(err.code=="permission-denied"){alert("Ye slot kisi aur ne le liya ya join nahi ho paya. Dobara slot chuno.");pick.taken=await slotsTaken(id);pick.sel=null;draw()}
  else alert("Nahi hua: "+(err.code||err.message));
 }
}
const card=m=>{
 const up=m.status=="upcoming",full=m.count>=m.slots,rem=Math.max(0,m.slots-m.count),pct=Math.min(100,Math.round(m.count/m.slots*100));
 const label=m.status=="live"?"Live":m.status=="done"?"Khatam":left(m.startTime);
 return`<div class="card" data-open="${m.id}" style="cursor:pointer"><div class="row"><div><div class="t">${esc(m.title)}</div><div class="dim">${esc(m.mode)}, ${esc(m.map)}</div></div><div class="cd">${label}</div></div>
 <div class="row dim"><span>Prize <b class="coins">₹${m.prizeInr||0}</b></span><span>Fee ${m.fee?"₹"+m.fee:"Free"}</span></div>
 <div class="bar"><i style="width:${pct}%"></i></div>
 <div class="row dim"><span>${rem?"Sirf "+rem+" slot khali":"Slots full"}</span><span>${m.count}/${m.slots}</span></div>
 ${m.joined&&m.slot?`<div class="dim">Aapka slot: <b class="coins">#${m.slot}</b></div>`:""}
 ${m.joined?`${m.status=="done"?"":!m.fee||m.paid?`<div class="dim">${m.paidVia==="wallet"?"Wallet se fee kat gayi ✓":m.paid?"Fee confirm ho gayi ✓":""}</div><button class="ghost" data-room="${m.id}">Room ID dekho</button>`:`<div class="room"><span>Fee ₹${m.fee} is QR se bhejo ${m.payInfo?`<b>${esc(m.payInfo)}</b>`:""}</span><img src="qr.png" alt="Payment QR" onerror="this.remove()" style="width:100%;max-width:240px;background:#fff;padding:8px;border-radius:10px;justify-self:center"><div class="payer"><input id="pn${m.id}" placeholder="Payment karne wale ka naam" maxlength="60" value="${esc(m.payerName||"")}"><input id="pu${m.id}" placeholder="UTR number (12 ank)" inputmode="numeric" maxlength="14" value="${esc(m.utr||"")}"><button class="ghost" data-payer="${m.id}">${m.payerName?"Details badlo":"Details save karo"}</button></div>${m.payerName?`<span class="dim">Aapne likha: <b>${esc(m.payerName)}</b>${m.utr?`, UTR <b>${esc(m.utr)}</b>`:""}</span>`:`<span class="dim">Jis naam se UPI mein paise bheje wahi likho. UTR payment ki detail mein 12 ank ka hota hai.</span>`}<span class="dim">Fee confirm hone par hi aapka slot book hoga aur Room ID dikhega. Wallet se pay karna chahte ho to join dobara try karo.</span></div>`}<div id="r${m.id}"></div>`
 :up?`<button data-join="${m.id}" ${full?"disabled":""}>${full?"Slots full":(m.fee?"Join karo (fee ₹"+m.fee+")":"Match join karo (free)")}</button>`:""}</div>`};

const shrink=file=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.85))};
 im.onerror=()=>no(new Error("Image nahi khuli"));im.src=u});

async function meView(v){
 const W=getWallet(profile);
 const hist=W.tx.length?W.tx.map(x=>`<div class="row tx"><div><b>${esc(x.t)}</b><div class="dim">${new Date(x.at).toLocaleString()}</div></div><div style="text-align:right"><b class="${x.a<0?"":"ok"}">${inr(x.a)}</b><div class="dim">${esc(x.s||"")}</div></div></div>`).join(""):`<p class="dim">Abhi koi transaction nahi.</p>`;
 v.innerHTML=`<div class="card"><div class="t">${esc(profile.ign)}</div><div class="dim">Free Fire UID: ${esc(profile.ffUid)}</div><button class="ghost" id="out">Logout</button></div>

 <div class="card">
  <div class="t">Wallet</div>
  <div class="dim">Entry fee pehle Deposit se, phir Bonus se kat-ti hai. Prize Winning balance mein aata hai.</div>
  <div class="row bal"><span class="dim">Winning Balance</span><b class="coins">₹${W.w}</b></div>
  <div class="row bal"><span class="dim">Deposit Balance</span><b class="coins">₹${W.d}</b></div>
  <div class="row bal"><span class="dim">Bonus Balance</span><b class="coins">₹${W.b}</b></div>
  <div class="row bal"><span class="dim">Total</span><b class="coins">₹${W.w+W.d+W.b}</b></div>
  <div class="two"><button id="wadd">+ Add Cash</button><button class="ghost" id="wwd">Withdraw</button></div>
 </div>

 <div class="card">
  <div class="t">Transaction History</div>
  ${hist}
 </div>

 <div class="card"><div class="t">Match notification</div><div class="dim">Match shuru hone se pehle alert paane ke liye chalu karo.</div><button id="pushbtn">Notification chalu karo</button><div class="dim" id="pushmsg"></div></div>
 <form class="card" id="pyf"><div class="t">Prize payout details</div><div class="dim">Jeetne par prize bhejne ke liye. Ye sirf aap aur admin dekh sakte ho.</div><input name="upi" id="pyu" placeholder="Aapka UPI ID"><label class="dim">Ya apne UPI QR ki image (optional)<input name="qr" type="file" accept="image/*"></label><img id="pyq" alt="" style="display:none;width:100%;max-width:220px;background:#fff;padding:8px;border-radius:10px;justify-self:center"><button>Save karo</button></form>`;

 $("#out").onclick=()=>signOut(auth);
 $("#pushbtn").onclick=enablePush;
 if(typeof Notification!="undefined"&&Notification.permission=="granted")$("#pushmsg").textContent="Notification ki ijazat mili hui hai.";

 $("#wadd").onclick=()=>openWalletSheet("add");
 $("#wwd").onclick=()=>openWalletSheet("wd");

 const ref=doc(db,"users",me.uid,"private","payout");let qr="";
 try{const s=await getDoc(ref);if(s.exists()){$("#pyu").value=s.data().upi||"";qr=s.data().qr||"";if(qr){$("#pyq").src=qr;$("#pyq").style.display="block"}}}catch(e){}
 $("#pyf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get("qr");
  try{
   if(file&&file.size)qr=await shrink(file);
   await setDoc(ref,{upi:f.get("upi").trim(),qr,at:Date.now()});
   e.target.querySelector("button").textContent="Save ho gaya";
   if(qr){$("#pyq").src=qr;$("#pyq").style.display="block"}
  }catch(err){alert("Nahi hua: "+(err.code||err.message))}};
}

let wstep=1; // 1=amount, 2=payment details (add only)
function openWalletSheet(m){
 wmode=m; wstep=1;
 $("#wstitle").textContent=m==="add"?"Add Cash":"Withdraw";
 $("#wsnote").textContent=m==="add"?"Pehle rakam chuno. Phir QR se paise bhejkar UTR bharna hoga. Admin confirm karega tab Deposit me aayega.":"Sirf Winning balance se nikal sakte ho.";
 $("#wchips").innerHTML=[10,50,100,500].map(n=>`<button class="ghost" data-n="${n}">₹${n}</button>`).join("");
 $("#wamt").value="";$("#wserr").textContent="";
 $("#wpaybox").hidden=true; $("#wpn").value=""; $("#wutr").value="";
 $("#wok").textContent=m==="add"?"Aage":"Confirm";
 $("#wsheet").hidden=false;
}

async function doWalletAction(){
 const n=Math.floor(+$("#wamt").value);
 const W=getWallet(profile);
 let err="";
 if(wmode==="add"){
  if(wstep===1){
   if(!(n>=1&&n<=10000)){err="₹1 se ₹10000 ke beech rakam likho.";$("#wserr").textContent=err;return}
   wstep=2;
   $("#wsnote").textContent="₹"+n+" is QR se bhejo, phir naam aur UTR likho.";
   $("#wpaybox").hidden=false;
   $("#wok").textContent="Request bhejo";
   $("#wserr").textContent="";
   return;
  }
  // step 2 – submit deposit request
  const nm=($("#wpn").value||"").trim();
  const ut=($("#wutr").value||"").replace(/\s/g,"");
  if(!nm){err="Pehle payment karne wale ka naam likho.";$("#wserr").textContent=err;return}
  if(!/^\d{12}$/.test(ut)){err="UTR 12 ank ka hona chahiye (sirf number).";$("#wserr").textContent=err;return}
  try{
   await addDoc(collection(db,"deposits"),{
     uid:me.uid, ign:profile.ign||"", ffUid:profile.ffUid||"",
     amount:n, payerName:nm, utr:ut,
     status:"pending", at:Date.now()
   });
   logTx(W,"Add Cash request ₹"+n+" (pending)",0,"Pending");
   await saveWallet(W); // only tx log
   $("#wsheet").hidden=true;
   alert("Request bhej di. Admin confirm karega tab Deposit balance me ₹"+n+" aa jayega.");
   if(tab==="me")draw();
  }catch(e){alert("Nahi hua: "+(e.code||e.message))}
  return;
 }
 // withdraw
 if(!(n>=10))err="Kam se kam ₹10 nikal sakte ho.";
 else if(n>W.w)err="Winning balance mein sirf ₹"+W.w+" hai.";
 else{W.w-=n;logTx(W,"Withdraw",-n)}
 if(err){$("#wserr").textContent=err;return}
 try{
  await saveWallet(W);
  $("#wsheet").hidden=true;
 }catch(e){alert("Nahi hua: "+(e.code||e.message))}
}

function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 const v=$("#view");
 if(tab=="matches"&&document.activeElement&&document.activeElement.matches("#view .payer input"))return;
 if(pick&&tab=="matches")return slotView(v);
 if(detail&&tab=="matches")return detailView(v);
 if(tab=="matches"){
  if(curCat===null){
   v.innerHTML=home();
   
  }else{
   const list=curCat[0]=="@"?matches.filter(m=>m.status==curCat.slice(1)&&vis(m)):matches.filter(m=>inCat(m,curCat)&&m.status!="done");
   v.innerHTML=`<button class="ghost" data-back>‹ Home</button>`+(list.length?list.map(card).join(""):`<p class="dim">Is mode mein abhi koi match nahi hai.</p>`);
  }
 }
 if(tab=="rank")v.innerHTML=ranks.map((u,i)=>`<div class="card row"><span class="t">${i+1}. ${esc(u.ign)}</span><b class="coins">${u.coins}</b></div>`).join("");
 if(tab=="me")meView(v);
}

$("#nav").onclick=e=>{document.activeElement&&document.activeElement.blur();const b=e.target.closest("button");if(b){if(b.dataset.tab=="matches"&&tab=="matches"){curCat=null;pick=null;detail=null}tab=b.dataset.tab;draw()}};
$("#view").onclick=async e=>{
 if(e.target.closest("button")&&document.activeElement)document.activeElement.blur();
 if(e.target.closest("[data-dback]")){detail=null;draw();return}
 const dt=e.target.closest("[data-dtab]");if(dt&&detail){detail.tab=dt.dataset.dtab;draw();return}
 const op=e.target.closest("[data-open]");if(op&&!e.target.closest("button")){await openDetail(op.dataset.open);return}
 if(e.target.closest("[data-pickback]")){pick=null;draw();return}
 const sb=e.target.closest("[data-slot]");if(sb&&pick){pick.sel=+sb.dataset.slot;draw();return}
 if(e.target.closest("[data-pickgo-wallet]")&&pick){await confirmPick(true);return}
 if(e.target.closest("[data-pickgo-upi]")&&pick){await confirmPick(false);return}
 if(e.target.closest("[data-pickgo]")&&pick){await confirmPick(false);return}
 if(e.target.closest("[data-back]")){curCat=null;draw();return}
 const ct=e.target.closest("[data-cat]");if(ct){curCat=ct.dataset.cat;draw();return}
 const b=e.target.closest("button[data-join],button[data-leave],button[data-room],button[data-payer]");if(!b)return;
 const d=b.dataset,pl=id=>doc(db,"matches",id,"players",me.uid);
 try{
  if(d.join){await openPick(d.join)}
  else if(d.payer){const nm=($("#pn"+d.payer).value||"").trim(),ut=($("#pu"+d.payer).value||"").replace(/\s/g,"");
   if(!nm){alert("Pehle naam likho.");return}
   if(!/^\d{12}$/.test(ut)){alert("UTR number likho. UTR 12 ank ka hota hai (sirf number), apne UPI app ki payment detail mein dekho.");return}
   await updateDoc(doc(db,"matches",d.payer,"players",me.uid),{payerName:nm,utr:ut});await load(matches)}
  else if(d.leave){await deleteDoc(pl(d.leave));await load(matches)}
  else{const s=await getDoc(doc(db,"matches",d.room,"secret","room")),x=$("#r"+d.room);
   x.innerHTML=s.exists()&&s.data().id?`<div class="room"><span>Room ID: <b>${esc(s.data().id)}</b></span><span>Password: <b>${esc(s.data().pass)}</b></span></div>`:`<p class="dim">Room ID abhi admin ne nahi daala.</p>`}
 }catch(err){alert("Nahi hua: "+(err.code||err.message))}
};
// Wallet sheet controls
$("#wcancel").onclick=()=>{$("#wsheet").hidden=true};
$("#wchips").onclick=e=>{const b=e.target.closest("button");if(b)$("#wamt").value=b.dataset.n};
$("#wok").onclick=doWalletAction;

setInterval(()=>{const c=$("#car");if(!c||c.children.length<2)return;const i=(Math.round(c.scrollLeft/c.clientWidth)+1)%c.children.length;c.scrollTo({left:i*c.clientWidth,behavior:"smooth"})},4000);
setInterval(()=>{if(me&&tab=="matches")load(matches)},45000);
</script>
