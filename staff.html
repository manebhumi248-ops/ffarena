<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0a1f">
<title>SM ARENA Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a1f;--panel:#1a1433;--panel2:#221b42;--line:#3a2f66;
  --text:#efeaff;--dim:#9b92c4;--flame:#ff6a3d;--gold:#ffc94a;
  --teal:#1ec8b8;--pink:#c44dff;--ok:#35d08a;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:500 16px/1.4 Rajdhani,system-ui,sans-serif;padding:0 0 88px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:640px;margin:auto}
h1{font-size:24px;font-weight:700}
main{display:grid;gap:12px;padding:0 14px 20px;max-width:640px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bal{padding:8px 0;border-bottom:1px solid var(--line)}.bal:last-child{border:0}
.dim{color:var(--dim)}.coins{color:var(--gold);font-weight:700}.t{font-size:20px;font-weight:700}
button{font:700 15px Rajdhani,sans-serif;background:var(--flame);color:#fff;border:0;border-radius:12px;padding:11px 12px;cursor:pointer;width:100%}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.on{background:var(--gold);color:#14112b}
button:disabled{opacity:.45}
button.teal{background:var(--teal);color:#062422}
button.pink{background:var(--pink);color:#fff}
button.sm{width:auto;padding:8px 14px;font-size:14px}
input,select,textarea{font:500 15px Rajdhani,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.n{width:84px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;color:var(--dim);border-radius:0;padding:14px 0;font-size:13px}
nav button.on{background:none;color:var(--flame);box-shadow:inset 0 3px var(--flame)}
#msg{color:var(--flame)}

/* Match filter tabs */
.mtabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--panel2);border-radius:14px;padding:4px;border:1px solid var(--line)}
.mtabs button{background:transparent;color:var(--dim);border-radius:10px;padding:10px}
.mtabs button.on{background:transparent;color:var(--gold);box-shadow:inset 0 -3px var(--gold)}

/* Match card (target UI style) */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;position:relative}
.mhead{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.mico{width:48px;height:48px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;font-size:22px;background:var(--bg)}
.mtitle{font-size:18px;font-weight:700}
.mid{color:var(--teal);font-weight:700;font-size:14px}
.mmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.mmeta span{color:var(--dim)}
.mmeta b{color:var(--text);font-weight:600}
.mmeta .prize{color:var(--gold)}
.roomline{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--dim)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--flame))}
.slotlbl{font-size:13px;color:var(--dim);margin-top:2px}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.fab{position:fixed;right:18px;bottom:96px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--flame),var(--pink));color:#fff;font-size:28px;font-weight:700;border:0;box-shadow:0 8px 24px rgba(255,106,61,.4);z-index:9;width:56px;padding:0;display:grid;place-items:center;cursor:pointer}
.badge{font-size:12px;padding:3px 8px;border-radius:8px;font-weight:700}
.badge.up{background:rgba(255,201,74,.15);color:var(--gold)}
.badge.live{background:rgba(255,80,80,.2);color:#ff6b6b}
.badge.done{background:rgba(53,208,138,.15);color:var(--ok)}
.sheet{position:fixed;inset:0;background:rgba(5,3,15,.8);display:grid;align-items:end;z-index:30}
.sheet .card{border-radius:18px 18px 0 0;max-width:640px;width:100%;margin:auto;max-height:90vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
/* Dashboard / StarPanel style */
.dash{display:grid;gap:12px}
.wel{background:linear-gradient(135deg,#2a1a5c,#1a1433);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;position:relative}
.wel .brand{font-size:22px;font-weight:700;color:var(--gold)}
.wel .hello{font-size:16px;color:var(--text)}
.wel .meta{font-size:13px;color:var(--dim)}
.wel .logout{position:absolute;top:14px;right:14px;width:auto;padding:6px 12px;font-size:13px}
.access{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:700;color:var(--dim)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.sec h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qtile{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;display:grid;gap:6px;font-weight:700;font-size:13px}
.qtile:active{transform:scale(.98)}
.qtile .qi{font-size:28px}
.actrow{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.actrow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actrow .ttl{font-weight:700}
.actrow .idtag{background:rgba(30,200,184,.15);color:var(--teal);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.actrow .bar{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.actrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink))}
.badge-n{background:var(--flame);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modetile{cursor:pointer;text-align:center;display:grid;gap:8px}
.modetile .mimg{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.modetile .mimg img{width:100%;height:100%;object-fit:cover}
.modetile .mimg .ph{font-size:36px}
.modetile .mname{font-weight:700;font-size:14px}
.modetile .mopen{font-size:12px;color:var(--ok);font-weight:700}
/* My Earning dashboard */
.earn-hero{background:linear-gradient(135deg,#2a1a5c,#1a1433);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;display:grid;gap:6px}
.earn-hero .et{font-size:22px;font-weight:700}
.earn-hero .et span{color:var(--flame)}
.earn-hero .ew{color:var(--dim);font-size:14px}
.earn-last{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.earn-last .ll{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.3px;color:var(--dim)}
.earn-last .lv{color:var(--teal);font-weight:700;font-size:13px;text-align:right}
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.earn-tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:grid;gap:8px;text-align:center}
.earn-tile .el{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.earn-tile .ev{font-size:22px;font-weight:700}
.earn-tile .ev.c-teal{color:var(--teal)}
.earn-tile .ev.c-ok{color:var(--ok)}
.earn-tile .ev.c-pink{color:#e879f9}
.earn-tile .ev.c-blue{color:#818cf8}
.earn-rate{background:#0a0814;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.earn-rate .rl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--dim)}
.earn-rate .rv{color:var(--teal);font-weight:700;font-size:18px}
/* Attractive staff login */
.auth-wrap{min-height:calc(100vh - 40px);display:grid;align-content:center;gap:0;padding:12px 0 24px}
.auth-hero{text-align:center;display:grid;gap:6px;margin-bottom:8px}
.auth-logo{font-size:32px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#fff,#c44dff,#1ec8b8);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Georgia,"Segoe Script",cursive}
.auth-sub{color:#35d08a;font-size:13px;font-weight:600}
.auth-art{width:100%;max-width:320px;margin:8px auto 16px;display:block}
.auth-box{display:grid;gap:12px;max-width:400px;margin:0 auto;width:100%}
.auth-box .field{position:relative}
.auth-box .field input{background:#fff;color:#1a1a2e;border:0;border-radius:28px;padding:14px 18px 14px 46px;font-size:15px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.auth-box .field .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.7;pointer-events:none}
.auth-box .field.pw input{padding-right:48px}
.auth-box .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;width:auto;padding:6px;color:#6b7280;font-size:16px}
.auth-box .btn-main{background:linear-gradient(180deg,#ff5a4a,#e11d48);border-radius:28px;padding:14px;font-size:17px;box-shadow:0 6px 20px rgba(225,29,72,.4);border:2px solid #fbbf24}
.auth-msg{text-align:center;min-height:20px;font-size:14px;color:var(--flame)}
.auth-badge{margin:16px auto 0;background:#1a1f2e;border-radius:12px;padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;font-size:13px;color:var(--dim);border:1px solid var(--line)}
.auth-badge span{color:var(--teal);font-weight:700}
body.auth-mode header{display:none}
body.auth-mode{padding-bottom:20px}
body.auth-mode main{max-width:440px}
</style>
</head>
<body>
<header>
  <h1>SM ARENA Staff</h1>
  <button class="ghost sm" id="out" hidden>Logout</button>
</header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="matches" class="on">Matches</button>
  <button data-tab="mywork">My Work</button>
  <button data-tab="pay">Payment</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,increment,writeBatch,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyD1-5WDFX-kv1RzNVgTVSqK4pkNbjGqCGk",authDomain:"sm-zone-aa784.firebaseapp.com",projectId:"sm-zone-aa784",appId:"1:892451469784:web:45b5cc8ef7d5264252daad"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
// Login browser mein yaad rahe (refresh / band-khol pe bhi)
setPersistence(auth,browserLocalPersistence).catch(()=>{});
// Secondary app: naya admin banate waqt current login disturb nahi hoga
let secondaryApp=null,secondaryAuth=null;
function getSecondaryAuth(){
 if(!secondaryAuth){
  secondaryApp=initializeApp(cfg,"adminSecondary");
  secondaryAuth=getAuth(secondaryApp);
 }
 return secondaryAuth;
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="matches",mFilter="upcoming",matches=[],users=[],cats=[],site={},deps=[],wds=[],staffPays=[],subs=[],slotCount={},showForm=false,openId=null,pickMode=false,matchCat="",plOpen=false,userQ="",staffProfile=null,isFullAdmin=false;

// System back (phone / browser)
function navDepth(){
 if(openId)return 3;
 if(showForm&&matchCat)return 2;
 if(matchCat)return 1;
 if(pickMode)return 1;
 if(tab==="mywork"||tab==="pay")return 1;
 return 0;
}
function goBack(){
 if(openId){openId=null;plOpen=false;showForm=false;draw();return true}
 if(showForm){showForm=false;draw();return true}
 if(matchCat){matchCat="";showForm=false;pickMode=true;draw();return true}
 if(pickMode){pickMode=false;draw();return true}
 if(tab==="mywork"||tab==="pay"){tab="matches";draw();return true}
 return false;
}
let _lastNavDepth=0;
function pushNav(){
 const d=navDepth();
 if(d>_lastNavDepth){try{history.pushState({spa:1,d},"",location.href)}catch(e){}}
 _lastNavDepth=d;
}
window.addEventListener("popstate",()=>{
 if(goBack()){
  _lastNavDepth=navDepth();
  if(navDepth()>0)try{history.pushState({spa:1,d:navDepth()},"",location.href)}catch(e){}
 }
});
try{history.replaceState({spa:1,d:0},"",location.href)}catch(e){}

// "HH:MM" → minutes from midnight
const toMins=t=>{
 if(!t||typeof t!=="string")return null;
 const p=t.split(":");
 const h=+p[0],m=+(p[1]||0);
 if(!Number.isFinite(h)||!Number.isFinite(m))return null;
 return h*60+m;
};
function withinDuty(){
 if(isFullAdmin)return true;
 if(!staffProfile)return false;
 const a=toMins(staffProfile.workStart),b=toMins(staffProfile.workEnd);
 if(a==null||b==null)return true; // time set nahi to allow
 const now=new Date();
 const cur=now.getHours()*60+now.getMinutes();
 if(a<=b)return cur>=a&&cur<=b; // same day e.g. 10:00-22:00
 return cur>=a||cur<=b; // overnight e.g. 22:00-06:00
}
function dutyLabel(){
 if(isFullAdmin)return"Admin full access";
 if(!staffProfile)return"";
 const m=staffProfile.modeName||"—";
 const t=(staffProfile.workStart&&staffProfile.workEnd)?`${staffProfile.workStart}–${staffProfile.workEnd}`:"time set nahi";
 return`Mode: ${m} · Duty: ${t}`;
}

function loginView(m=""){
 $("#nav").hidden=true;$("#out").hidden=true;
 document.body.classList.add("auth-mode");
 const art=`<svg class="auth-art" viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
   <linearGradient id="sg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
   <linearGradient id="sg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
   <linearGradient id="sg3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
   <filter id="sglow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M0 120 L40 70 L70 95 L110 40 L150 85 L180 55 L220 100 L260 45 L300 90 L340 60 L360 120 Z" fill="none" stroke="url(#sg1)" stroke-width="2.5" filter="url(#sglow)"/>
  <path d="M20 120 L60 85 L95 105 L130 60 L170 95 L210 70 L250 110 L290 65 L330 95 L360 120" fill="none" stroke="url(#sg2)" stroke-width="2" opacity=".85" filter="url(#sglow)"/>
  <path d="M0 120 L50 95 L90 110 L140 75 L190 105 L240 80 L290 115 L340 85 L360 120" fill="none" stroke="url(#sg3)" stroke-width="2" opacity=".75" filter="url(#sglow)"/>
  <circle cx="110" cy="40" r="3" fill="#fff" opacity=".9"/><circle cx="260" cy="45" r="2.5" fill="#fff" opacity=".8"/>
 </svg>`;
 $("#view").innerHTML=`<div class="auth-wrap">
  <div class="auth-hero">
   <div class="auth-logo">.. SM ARENA ..</div>
   <div class="auth-sub">Staff panel · username se login karo</div>
  </div>
  ${art}
  <form class="auth-box" id="lf">
   <div class="field"><span class="ico">👤</span><input name="u" placeholder="Username" required autocomplete="username"></div>
   <div class="field pw"><span class="ico">🔒</span><input name="p" id="spw" type="password" placeholder="Enter password" required autocomplete="current-password"><button type="button" class="eye" id="togpw" aria-label="Show">👁</button></div>
   <p id="msg" class="auth-msg">${esc(m)}</p>
   <button class="btn-main" type="submit">Continue</button>
   <div class="auth-badge">⭐ <span>Staff Access</span> · SM ARENA</div>
  </form>
 </div>`;
 const eye=$("#togpw");
 if(eye)eye.onclick=()=>{const i=$("#spw");if(!i)return;i.type=i.type==="password"?"text":"password";eye.textContent=i.type==="password"?"👁":"🙈"};
 $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  const u=(f.get("u")||"").trim().toLowerCase().replace(/\s+/g,"");
  const p=f.get("p");
  const btn=e.target.querySelector(".btn-main");
  if(!u){$("#msg").textContent="Username likho.";return}
  if(btn){btn.disabled=true;btn.textContent="Ruko..."}
  const email=u.includes("@")?u:(u+"@staff.sm-arena.app");
  try{await signInWithEmailAndPassword(auth,email,p)}catch(err){
   const c=err.code||"";
   if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found")
    $("#msg").textContent="Username ya password galat hai.";
   else $("#msg").textContent="Nahi hua: "+(c||err.message);
   if(btn){btn.disabled=false;btn.textContent="Continue"}
  }};
}

onAuthStateChanged(auth,async u=>{
 subs.forEach(f=>f());subs=[];
 staffProfile=null;isFullAdmin=false;
 if(!u)return loginView();
 let st=null,ad=null;
 try{
  [st,ad]=await Promise.all([getDoc(doc(db,"staff",u.uid)),getDoc(doc(db,"admins",u.uid))]);
 }catch(err){
  // Rules block ya network — logout mat karo blindly; clear message do
  const code=err&&err.code||"";
  if(code==="permission-denied"){
   await signOut(auth).catch(()=>{});
   return loginView("Staff doc read block (Firestore rules). Admin rules mein staff/{uid} self-read allow kare.");
  }
  return loginView("Check fail: "+(code||err.message||"network"));
 }
 if(!st.exists()&&!ad.exists()){
  // Auth ok hai lekin staff/{uid} doc nahi — logout ke bajay message
  await signOut(auth).catch(()=>{});
  return loginView("Ye email Auth mein hai, lekin staff list mein nahi. Admin panel → Modes → Staff account banao (same email). UID: "+u.uid.slice(0,8)+"…");
 }
 isFullAdmin=ad.exists();
 staffProfile=st.exists()?{id:st.id,...st.data()}:(isFullAdmin?{modeId:"",modeName:"ALL",workStart:"",workEnd:""}:null);
 document.body.classList.remove("auth-mode");
 $("#nav").hidden=false;$("#out").hidden=false;
 let _drawT=null,_slotGen=0;
 const scheduleDraw=()=>{
  if(document.activeElement&&document.activeElement.closest("#view input,#view textarea,#view select"))return;
  clearTimeout(_drawT);_drawT=setTimeout(()=>{_drawT=null;draw()},100);
 };
 window.__scheduleDraw=scheduleDraw;
 subs.push(onSnapshot(doc(db,"categories","home"),s=>{site=s.exists()?s.data():{};if(tab=="cats")scheduleDraw()}));
 subs.push(onSnapshot(query(collection(db,"categories"),orderBy("order")),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="cats"||tab=="matches")scheduleDraw()}));
 subs.push(onSnapshot(query(collection(db,"matches"),orderBy("startTime","desc")),s=>{
  matches=s.docs.map(d=>({id:d.id,...d.data()}));
  if(tab=="matches"||tab=="mywork")scheduleDraw();
  // slots: batch, ek hi redraw
  const gen=++_slotGen;
  (async()=>{
   const list=matches.filter(m=>m.status!=="done").slice(0,25);
   for(let i=0;i<list.length;i+=6){
    if(gen!==_slotGen)return;
    await Promise.all(list.slice(i,i+6).map(async m=>{
     try{slotCount[m.id]=(await getDocs(collection(db,"matches",m.id,"slots"))).size}catch(e){}
    }));
   }
   if(gen===_slotGen&&(tab=="matches"||tab=="mywork"))scheduleDraw();
  })();
 }));
 // Staff ke apne payment requests
 subs.push(onSnapshot(query(collection(db,"staffPayments"),orderBy("at","desc")),s=>{
  const uid=auth.currentUser&&auth.currentUser.uid;
  staffPays=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>!uid||p.uid===uid);
  if(tab=="pay")scheduleDraw();
 }));
});
$("#out").onclick=()=>signOut(auth);

const isPerKillMode=name=>{
 const n=String(name||"").toLowerCase().replace(/\s+/g," ");
 return (n.includes("full map")||n.includes("fullmap")||n.includes("survival")||n.includes("br "))&&(n.includes("br")||n.includes("battle")||n.includes("royale")||n.includes("survival")||n.includes("full"));
};
// BR Full Map / BR Survival only
const allowPerKill=name=>{
 const n=String(name||"").toLowerCase();
 return /full\s*map|survival/.test(n);
};
// 1v1 → 2 slots, 2v2 → 4 slots (fixed). Full Map / Survival → editable
const fixedSlots=name=>{
 const n=String(name||"").toLowerCase().replace(/\s+/g," ");
 if(/full\s*map|survival|br\s*fm|brfm|brs\b/.test(n))return null;
 if(/1\s*v\s*1|1v1/.test(n))return 2;
 if(/2\s*v\s*2|2v2/.test(n))return 4;
 return null;
};
// Mode → fixed banner (GitHub root images)
const modeBanner=name=>{
 const n=String(name||"").toLowerCase().replace(/\s+/g," ").trim();
 if(/cs\s*1\s*v\s*1|cs\s*1v1/.test(n))return"cs1v1.png";
 if(/cs\s*2\s*v\s*2|cs\s*2v2/.test(n))return"cs2v2.png";
 if(/lone\s*wolf\s*1\s*v\s*1|lw\s*1v1|lone\s*wolf\s*1v1/.test(n))return"lw1v1.png";
 if(/lone\s*wolf\s*2\s*v\s*2|lw\s*2v2|lone\s*wolf\s*2v2/.test(n))return"lw2v2.png";
 if(/full\s*map|br\s*fm|brfm/.test(n))return"brfm.png";
 if(/survival|brs\b/.test(n))return"brs.png";
 return"";
};
// Entry fee → auto prize
const feeToPrize=fee=>{
 const f=Math.floor(Number(fee)||0);
 if(f===10)return 17;
 if(f===20)return 35;
 if(f===50)return 85;
 return null;
};
const FEE_OPTS=[10,20,50];
function feeSelect(val){
 const v=Math.floor(Number(val)||10);
 const cur=FEE_OPTS.includes(v)?v:10;
 return`<select name="fee" required>${FEE_OPTS.map(n=>`<option value="${n}" ${n===cur?"selected":""}>₹${n}</option>`).join("")}</select>`;
}
function wireFeePrize(root){
 const scope=root||document;
 const fee=scope.querySelector('[name="fee"]');
 const prize=scope.querySelector('input[name="prizeInr"]');
 if(!fee||!prize)return;
 const apply=()=>{
  const p=feeToPrize(fee.value);
  prize.value=p!=null?p:"";
  prize.readOnly=true;
  prize.style.opacity="0.85";
  prize.style.pointerEvents="none";
 };
 fee.addEventListener("input",apply);
 fee.addEventListener("change",apply);
 apply();
}

   const dref=doc(db,"deposits",id);
   const ds=await getDoc(dref);
   if(!ds.exists()||ds.data().status!=="pending"){alert("Ye request already process ho chuki hai.");return}
   const data=ds.data();
   if(ok){
    if(!confirm("₹"+data.amount+" confirm? "+(data.ign||"")+" ke Deposit me jayega."))return;
    if(deps.some(x=>x.id!==id&&x.utr===data.utr&&x.status!=="rejected")&&!confirm("UTR dusre deposit mein bhi hai. Phir bhi?"))return;
    const uref=doc(db,"users",data.uid);
    const res=await runTransaction(db,async t=>{
     const ds2=await t.get(dref);
     if(!ds2.exists()||ds2.data().status!=="pending")return "done";
     const us=await t.get(uref);
     if(!us.exists())return "nouser";
     const cur=us.data().wallet||{};
     const W={w:typeof cur.w==="number"?cur.w:0, d:typeof cur.d==="number"?cur.d:0, b:typeof cur.b==="number"?cur.b:0, tx:Array.isArray(cur.tx)?cur.tx:[]};
     const amt=Number(ds2.data().amount)||0;
     W.d+=amt;
     W.tx.unshift({t:"Deposit confirmed ₹"+amt,a:amt,s:"Success",at:Date.now()});
     W.tx=W.tx.slice(0,40);
     t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
     t.update(dref,{status:"approved",approvedAt:Date.now()});
     return "ok";
    });
    if(res==="done")alert("Already process.");
    if(res==="nouser")alert("User nahi mila.");
   }else{
    if(!confirm("Reject karna hai?"))return;
    await updateDoc(dref,{status:"rejected",rejectedAt:Date.now()});
   }
  }
  else if(d.copy){const m=matches.find(x=>x.id==d.copy),t=new Date(m.startTime).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),txt="⏰ "+m.title+" "+t+" par shuru hoga. App kholo aur slot check karo!";
   try{await navigator.clipboard.writeText(txt);b.textContent="Copy ho gaya"}catch(e){prompt("Copy karo:",txt)}}
  else if(d.delcat){if(confirm("Mode delete?"))await deleteDoc(doc(db,"categories",d.delcat))}
  else if(d.deladmin){
   if(d.deladmin===(auth.currentUser&&auth.currentUser.uid)){alert("Apna admin hata nahi sakte.");return}
   if(!confirm("Is admin ko hatana hai? Login band ho jayega."))return;
   await deleteDoc(doc(db,"admins",d.deladmin));
   alert("Admin hata diya.");
   if(tab==="cats")draw();
  }
  else if(d.flag){const[mid,uid,f]=d.flag.split(":"),on=!b.classList.contains("on"),m=matches.find(x=>x.id==mid),pr=doc(db,"matches",mid,"players",uid);
   if(f=="paid"&&m.fee>0){
    const ps=await getDoc(pr),taken=new Set((await getDocs(collection(db,"matches",mid,"slots"))).docs.map(x=>x.id)),bt=writeBatch(db);
    if(on){
     if(taken.size>=m.slots){alert("Slots full.");return}
     let n=ps.data().want;if(!(n>=1&&n<=m.slots)||taken.has(String(n))){n=1;while(taken.has(String(n)))n++}
     bt.set(doc(db,"matches",mid,"slots",String(n)),{uid});bt.update(pr,{paid:true,slot:n});
    }else{
     const cur=ps.data().slot;if(cur)bt.delete(doc(db,"matches",mid,"slots",String(cur)));
     bt.update(pr,{paid:false,slot:null});
    }
    await bt.commit();
    slotCount[mid]=(await getDocs(collection(db,"matches",mid,"slots"))).size;
    plOpen=true;await fillPlayers(mid);
   }else if(f=="prizePaid"){
    let amt=0;
    if(on){
     // Sirf ek player ko prize
     const allP=await getDocs(collection(db,"matches",mid,"players"));
     const other=allP.docs.find(x=>x.id!==uid&&x.data().prizePaid);
     if(other){alert("Prize pehle se "+(other.data().ign||"kisi aur")+" ko mil chuka hai. Sirf ek ko de sakte ho.");return}
     const r=prompt("Prize ₹?",String(m.prizeInr||0));if(r===null)return;amt=Math.max(0,parseInt(r,10)||0);
     if(amt>0){
      const uref=doc(db,"users",uid);
      await runTransaction(db,async t=>{
       const us=await t.get(uref);
       if(!us.exists())return;
       const cur=us.data().wallet||{};
       const W={w:typeof cur.w==="number"?cur.w:0,d:typeof cur.d==="number"?cur.d:0,b:typeof cur.b==="number"?cur.b:0,tx:Array.isArray(cur.tx)?cur.tx.slice():[]};
       W.w+=amt;
       W.tx.unshift({t:"Prize: "+(m.title||"Match"),a:amt,s:"Success",at:Date.now()});
       W.tx=W.tx.slice(0,40);
       t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
      });
     }
    }else{
     // undo: prize hatao, wallet se kaat (agar pehle diya tha)
     const prev=+(await getDoc(pr)).data()?.prizeAmt||0;
     if(prev>0){
      const uref=doc(db,"users",uid);
      await runTransaction(db,async t=>{
       const us=await t.get(uref);
       if(!us.exists())return;
       const cur=us.data().wallet||{};
       const W={w:typeof cur.w==="number"?cur.w:0,d:typeof cur.d==="number"?cur.d:0,b:typeof cur.b==="number"?cur.b:0,tx:Array.isArray(cur.tx)?cur.tx.slice():[]};
       W.w=Math.max(0,W.w-prev);
       W.tx.unshift({t:"Prize undo: "+(m.title||"Match"),a:-prev,s:"Success",at:Date.now()});
       W.tx=W.tx.slice(0,40);
       t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
      });
     }
    }
    await updateDoc(pr,{prizePaid:on,prizeAmt:amt});
    if(on&&amt>0)alert("₹"+amt+" player ke Winning balance mein add ho gaya. Ab dusre ko prize nahi de sakte.");
    plOpen=true;await fillPlayers(mid);
   }else{await updateDoc(pr,{[f]:on});b.classList.toggle("on",on);b.classList.toggle("ghost",!on)}
  }
  else if(d.kick){
   const[mid,uid]=d.kick.split(":"),m=matches.find(x=>x.id==mid);
   const fee=Number(m?.fee)||0;
   if(!confirm((m?.title||"Match")+" se player REMOVE karna hai?"+(fee?`\n\nFee ₹${fee} unke Deposit wallet mein refund ho jayegi.`:"")))return;
   const pr=doc(db,"matches",mid,"players",uid);
   const ps=await getDoc(pr);
   if(!ps.exists()){alert("Player pehle se remove hai.");return}
   const pdata=ps.data(),slot=pdata.slot;
   const wasPaid=pdata.paid===true||pdata.paidVia==="wallet";
   await runTransaction(db,async t=>{
    if(wasPaid&&fee>0){
     const uref=doc(db,"users",uid);
     const us=await t.get(uref);
     if(us.exists()){
      const cur=us.data().wallet||{};
      const W={w:typeof cur.w==="number"?cur.w:0,d:typeof cur.d==="number"?cur.d:0,b:typeof cur.b==="number"?cur.b:0,tx:Array.isArray(cur.tx)?cur.tx.slice():[]};
      W.d+=fee;
      W.tx.unshift({t:"Refund: "+(m.title||"Match")+" (remove)",a:fee,s:"Success",at:Date.now()});
      W.tx=W.tx.slice(0,40);
      t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
     }
    }
    t.delete(pr);
    if(slot)t.delete(doc(db,"matches",mid,"slots",String(slot)));
   });
   try{slotCount[mid]=(await getDocs(collection(db,"matches",mid,"slots"))).size}catch(e){}
   alert(wasPaid&&fee>0?`Player remove. ₹${fee} Deposit mein refund.`:"Player remove ho gaya.");
   plOpen=true;await fillPlayers(mid);
  }
  else if(d.pl){
   openId=d.pl;
   plOpen=!plOpen;
   draw();
  }
  else if(d.award){
   if(!confirm("Result dedo? Match Done ho jayega."))return;
   const ins=[...($("#pl"+d.award)?.querySelectorAll("input[data-u]")||[])].filter(i=>+i.value>0);
   for(const i of ins)await updateDoc(doc(db,"users",i.dataset.u),{coins:increment(+i.value)});
   await updateDoc(doc(db,"matches",d.award),{status:"done",awarded:true,doneAt:Date.now()});
   await deleteDoc(doc(db,"matches",d.award,"secret","room")).catch(()=>{});
   openId=null;mFilter="done";
   alert("Result de diya · status Done.");
  }
 }catch(err){alert("Nahi hua: "+(err.code||err.message))}
};
</script>
</body>
</html>
