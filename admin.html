<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0a1f">
<title>SM ARENA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a1f;--panel:#1a1433;--panel2:#221b42;--line:#3a2f66;
  --text:#efeaff;--dim:#9b92c4;--flame:#ff6a3d;--gold:#ffc94a;
  --teal:#1ec8b8;--pink:#c44dff;--ok:#35d08a;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:500 16px/1.4 Rajdhani,system-ui,sans-serif;padding:0 0 88px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:640px;margin:auto}
h1{font-size:24px;font-weight:700}
main{display:grid;gap:12px;padding:0 14px 20px;max-width:640px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dim{color:var(--dim)}.coins{color:var(--gold);font-weight:700}.t{font-size:20px;font-weight:700}
button{font:700 15px Rajdhani,sans-serif;background:var(--flame);color:#fff;border:0;border-radius:12px;padding:11px 12px;cursor:pointer;width:100%}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.on{background:var(--gold);color:#14112b}
button:disabled{opacity:.45}
button.teal{background:var(--teal);color:#062422}
button.pink{background:var(--pink);color:#fff}
button.sm{width:auto;padding:8px 14px;font-size:14px}
input,select,textarea{font:500 15px Rajdhani,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.n{width:84px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;color:var(--dim);border-radius:0;padding:14px 0;font-size:13px}
nav button.on{background:none;color:var(--flame);box-shadow:inset 0 3px var(--flame)}
#msg{color:var(--flame)}

/* Match filter tabs */
.mtabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--panel2);border-radius:14px;padding:4px;border:1px solid var(--line)}
.mtabs button{background:transparent;color:var(--dim);border-radius:10px;padding:10px}
.mtabs button.on{background:transparent;color:var(--gold);box-shadow:inset 0 -3px var(--gold)}

/* Match card (target UI style) */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;position:relative}
.mhead{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.mico{width:48px;height:48px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;font-size:22px;background:var(--bg)}
.mtitle{font-size:18px;font-weight:700}
.mid{color:var(--teal);font-weight:700;font-size:14px}
.mmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.mmeta span{color:var(--dim)}
.mmeta b{color:var(--text);font-weight:600}
.mmeta .prize{color:var(--gold)}
.roomline{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--dim)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--flame))}
.slotlbl{font-size:13px;color:var(--dim);margin-top:2px}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.fab{position:fixed;right:18px;bottom:96px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--flame),var(--pink));color:#fff;font-size:28px;font-weight:700;border:0;box-shadow:0 8px 24px rgba(255,106,61,.4);z-index:9;width:56px;padding:0;display:grid;place-items:center;cursor:pointer}
.badge{font-size:12px;padding:3px 8px;border-radius:8px;font-weight:700}
.badge.up{background:rgba(255,201,74,.15);color:var(--gold)}
.badge.live{background:rgba(255,80,80,.2);color:#ff6b6b}
.badge.done{background:rgba(53,208,138,.15);color:var(--ok)}
.sheet{position:fixed;inset:0;background:rgba(5,3,15,.8);display:grid;align-items:end;z-index:30}
.sheet .card{border-radius:18px 18px 0 0;max-width:640px;width:100%;margin:auto;max-height:90vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
/* Dashboard / StarPanel style */
.dash{display:grid;gap:12px}
.wel{background:linear-gradient(135deg,#2a1a5c,#1a1433);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;position:relative}
.wel .brand{font-size:22px;font-weight:700;color:var(--gold)}
.wel .hello{font-size:16px;color:var(--text)}
.wel .meta{font-size:13px;color:var(--dim)}
.wel .logout{position:absolute;top:14px;right:14px;width:auto;padding:6px 12px;font-size:13px}
.access{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:700;color:var(--dim)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.sec h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qtile{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;display:grid;gap:6px;font-weight:700;font-size:13px}
.qtile:active{transform:scale(.98)}
.qtile .qi{font-size:28px}
.actrow{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.actrow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actrow .ttl{font-weight:700}
.actrow .idtag{background:rgba(30,200,184,.15);color:var(--teal);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.actrow .bar{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.actrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink))}
.badge-n{background:var(--flame);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modetile{cursor:pointer;text-align:center;display:grid;gap:8px}
.modetile .mimg{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.modetile .mimg img{width:100%;height:100%;object-fit:cover}
.modetile .mimg .ph{font-size:36px}
.modetile .mname{font-weight:700;font-size:14px}
.modetile .mopen{font-size:12px;color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>SM ARENA Admin</h1>
  <button class="ghost sm" id="out" hidden>Logout</button>
</header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="matches" class="on">Matches</button>
  <button data-tab="users">Users</button>
  <button data-tab="deps">Deposit</button>
  <button data-tab="cats">Modes</button>
  <button data-tab="rep">Hisaab</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,increment,writeBatch,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyD1-5WDFX-kv1RzNVgTVSqK4pkNbjGqCGk",authDomain:"sm-zone-aa784.firebaseapp.com",projectId:"sm-zone-aa784",appId:"1:892451469784:web:45b5cc8ef7d5264252daad"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="matches",mFilter="upcoming",matches=[],users=[],cats=[],site={},deps=[],subs=[],slotCount={},showForm=false,openId=null,pickMode=false,matchCat="";

function loginView(m=""){
 $("#nav").hidden=true;$("#out").hidden=true;
 $("#view").innerHTML=`<form class="card" id="lf"><div class="t">Admin Login</div><input name="e" type="email" placeholder="Admin email" required><input name="p" type="password" placeholder="Password" required><p id="msg">${esc(m)}</p><button>Login karo</button></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{await signInWithEmailAndPassword(auth,f.get("e"),f.get("p"))}catch(err){$("#msg").textContent="Nahi hua: "+err.code}};
}

onAuthStateChanged(auth,async u=>{
 subs.forEach(f=>f());subs=[];
 if(!u)return loginView();
 const a=await getDoc(doc(db,"admins",u.uid));
 if(!a.exists()){await signOut(auth);return loginView("Ye account admin nahi hai.")}
 $("#nav").hidden=false;$("#out").hidden=false;
 subs.push(onSnapshot(doc(db,"categories","home"),s=>{site=s.exists()?s.data():{};if(tab=="cats"&&!document.activeElement.closest("#view"))draw()}));
 subs.push(onSnapshot(query(collection(db,"categories"),orderBy("order")),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="cats"||(tab=="matches"&&!document.activeElement.closest("#view")))draw()}));
 subs.push(onSnapshot(query(collection(db,"matches"),orderBy("startTime","desc")),s=>{
  matches=s.docs.map(d=>({id:d.id,...d.data()}));
  // slot counts refresh (best effort)
  matches.slice(0,40).forEach(async m=>{
   try{const c=(await getDocs(collection(db,"matches",m.id,"slots"))).size;slotCount[m.id]=c;if(tab=="matches")draw()}catch(e){}
  });
  if(tab=="matches"&&!document.activeElement.closest("#view"))draw();
 }));
 subs.push(onSnapshot(query(collection(db,"users"),orderBy("coins","desc")),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="users")draw()}));
 subs.push(onSnapshot(query(collection(db,"deposits"),orderBy("at","desc")),s=>{deps=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="deps")draw()}));
});
$("#out").onclick=()=>signOut(auth);
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;showForm=false;pickMode=false;matchCat="";openId=null;draw()}};

const shortId=id=>(id||"").slice(-4).toUpperCase();
const fmtDate=t=>new Date(t).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});

function modesPicker(){
 if(!cats.length)return`<div class="card"><div class="t">Modes</div><p class="dim">Pehle Modes tab se mode banao.</p><button class="ghost" id="modeback">‹ Wapas</button></div>`;
 return`<div class="card"><div class="row"><div class="t">All Modes</div><button class="ghost sm" id="modeback">‹ Wapas</button></div>
 <div class="dim">Mode chuno, phir usme match add karo</div>
 <div class="modegrid">${cats.map(c=>{
  const open=matches.filter(m=>m.cat==c.id&&(m.status==="upcoming"||!m.status)&& (slotCount[m.id]??0)<m.slots).length;
  return`<div class="modetile" data-pickmode="${esc(c.id)}">
   <div class="mimg">${c.img?`<img src="${esc(c.img)}" alt="" onerror="this.parentNode.innerHTML='<div class=ph>🎮</div>'">`:`<div class="ph">🎮</div>`}</div>
   <div class="mname">${esc(c.name)}</div>
   ${open?`<div class="mopen">● ${open} open</div>`:""}
  </div>`;
 }).join("")}</div></div>`;
}

function matchForm(){
 const catOpts=cats.map(c=>`<option value="${esc(c.id)}" ${matchCat===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
 return `<div class="card" id="mfwrap"><div class="t">Naya match${matchCat?" · "+esc((cats.find(c=>c.id==matchCat)||{}).name||""):""}</div>
<form id="mf" class="panel" style="gap:8px">
<select name="cat" required><option value="">${cats.length?"Mode chuno":"Pehle Modes tab mein mode banao"}</option>${catOpts}</select>
<input name="title" placeholder="Match ka naam" required>
<div class="g"><select name="mode"><option>Solo</option><option>Duo</option><option>Squad</option></select><input name="map" placeholder="Map (Bermuda)" required></div>
<input name="start" type="datetime-local" required>
<div class="g"><input name="slots" type="number" min="2" placeholder="Slots" required><input name="prize" type="number" min="0" placeholder="Points (leaderboard)" required></div>
<div class="g"><input name="fee" type="number" min="0" placeholder="Entry fee ₹" required><input name="prizeInr" type="number" min="0" placeholder="Prize ₹" required></div>
<div class="g"><input name="perKill" type="number" min="0" placeholder="Per kill ₹"><input name="banner" placeholder="Banner image naam"></div>
<input name="ranks" placeholder="Rank prize: 1:17, 2:5">
<div class="g"><button type="button" class="ghost" id="mfcancel">Band</button><button>Match banao</button></div>
</form></div>`;
}

function mcard(m){
 const filled=slotCount[m.id]??0;
 const pct=Math.min(100,Math.round(filled/Math.max(1,m.slots)*100));
 const st=m.status||"upcoming";
 const badge=st==="live"?`<span class="badge live">Live</span>`:st==="done"?`<span class="badge done">Done</span>`:`<span class="badge up">Upcoming</span>`;
 const cat=(cats.find(c=>c.id==m.cat)||{}).name||"Other";
 const open=openId===m.id;
 return `<div class="mcard" id="m${m.id}">
  <div class="mhead">
   <div class="mico">🎮</div>
   <div>
    <div class="mtitle">${esc(m.title)} <span class="mid">(#${shortId(m.id)})</span></div>
    <div class="dim" style="font-size:13px">${fmtDate(m.startTime)} · ${esc(cat)}</div>
   </div>
   ${badge}
  </div>
  <div class="mmeta">
   <div><span>Total Prize:</span> <b class="prize">₹${m.prizeInr||0}</b></div>
   <div><span>Entry Fees:</span> <b>₹${m.fee||0}</b></div>
   <div><span>Per Kill:</span> <b>₹${m.perKill||0}</b></div>
   <div><span>Type:</span> <b>${esc(m.mode||"—")}</b></div>
   <div><span>Map:</span> <b>${esc(m.map||"—")}</b></div>
   <div><span>Points:</span> <b class="coins">${m.prize||0} pts</b></div>
  </div>
  <div class="roomline">
   <div>Room id: <b>${m._roomId?esc(m._roomId):"Not set"}</b></div>
   <div>Password: <b>${m._roomPass?"••••":"Not set"}</b></div>
  </div>
  <div>
   <div class="slotlbl">Slots: ${filled}/${m.slots} (${pct}%)</div>
   <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="mact">
   <button class="teal" data-pl="${m.id}">Participants</button>
   <button class="pink" data-upd="${m.id}">Update</button>
  </div>
  ${open?`<div class="panel" id="up${m.id}">
    <div class="t" style="font-size:16px">Update match</div>
    <div class="g3">${["upcoming","live","done"].map(s=>`<button class="${st==s?"on":"ghost"}" data-st="${m.id}:${s}">${{upcoming:"Upcoming",live:"Live",done:"Done"}[s]}</button>`).join("")}</div>
    ${st==="done"?`<div class="dim">Match khatam.</div>`:`
    <div class="g"><input id="ri${m.id}" placeholder="Room ID" value="${esc(m._roomId||"")}"><input id="rp${m.id}" placeholder="Password" value="${esc(m._roomPass||"")}"></div>
    <button class="ghost" data-room="${m.id}">Room save karo</button>`}
    <div id="pl${m.id}"></div>
    <button class="ghost" data-copy="${m.id}">Notification text copy</button>
    <button class="ghost" data-del="${m.id}" style="border-color:#ff6b6b;color:#ff6b6b">Match delete</button>
  </div>`:""}
 </div>`;
}

let repRange="30";
const repCalc=(m,ps)=>{const paid=ps.filter(p=>p.paid).length;return{paid,got:paid*(m.fee||0),gave:ps.reduce((s,p)=>s+(p.prizePaid?(+p.prizeAmt||0):0),0)}};
const repRow=r=>`<div class="card"><div class="t">${esc(r.m.title)}</div><div class="dim">${new Date(r.m.startTime).toLocaleDateString()}, ${r.paid} player ne fee di</div><div class="row"><span>Fee mili</span><b class="coins">₹${r.got}</b></div><div class="row"><span>Prize diya</span><b class="coins">₹${r.gave}</b></div><div class="row"><span>Bacha</span><b class="coins">₹${r.got-r.gave}</b></div></div>`;
async function repView(v){
 const head=`<div class="card"><div class="t">Kamai ka hisaab</div><select id="rr"><option value="1">Aaj</option><option value="7">Pichhle 7 din</option><option value="30">Pichhle 30 din</option><option value="0">Sab</option></select></div>`;
 const mount=body=>{v.innerHTML=head+body;const s=$("#rr");s.value=repRange;s.onchange=()=>{repRange=s.value;repView(v)}};
 mount(`<p class="dim">Hisaab ban raha hai...</p>`);
 const days=+repRange,from=days?Date.now()-days*864e5:0;
 const list=matches.filter(m=>m.startTime>=from&&(m.fee>0||m.prizeInr>0)).sort((a,b)=>b.startTime-a.startTime);
 let rows;
 try{rows=await Promise.all(list.map(async m=>({m,...repCalc(m,(await getDocs(collection(db,"matches",m.id,"players"))).docs.map(d=>d.data()))})))}
 catch(e){if(tab=="rep")mount(`<p class="dim">Nahi hua: ${esc(e.code||e.message)}</p>`);return}
 if(tab!="rep")return;
 const T=rows.reduce((a,r)=>({got:a.got+r.got,gave:a.gave+r.gave}),{got:0,gave:0});
 mount(`<div class="card"><div class="t">Total</div><div class="row"><span>Fee mili</span><b class="coins">₹${T.got}</b></div><div class="row"><span>Prize diya</span><b class="coins">₹${T.gave}</b></div><div class="row"><span>Bacha</span><b class="coins">₹${T.got-T.gave}</b></div></div>`+(rows.length?rows.map(repRow).join(""):`<p class="dim">Is samay mein koi fee ya prize wala match nahi hai.</p>`));
}

function catsView(v){
 v.innerHTML=`<form class="card" id="hf"><div class="t">Home page</div><input name="notice" placeholder="Notice" value="${esc(site.notice)}"><input name="support" placeholder="Support chat link" value="${esc(site.support)}"><input name="banners" placeholder="Banner images, comma se" value="${esc((site.banners||[]).join(", "))}"><input name="vapidKey" placeholder="VAPID key" value="${esc(site.vapidKey)}"><textarea name="rules" rows="5" placeholder="Rules (har line alag)">${esc(site.rules)}</textarea><button>Home save</button></form>
<form class="card" id="cf"><div class="t">Naya mode</div><input name="name" placeholder="Mode naam" required><input name="img" placeholder="Image naam (optional)"><button>Mode jodo</button></form>`+
 cats.map(c=>`<div class="card row"><div class="t">${esc(c.name)}</div><button class="ghost sm" data-delcat="${c.id}">Delete</button></div>`).join("");
 $("#hf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{await setDoc(doc(db,"categories","home"),{notice:f.get("notice").trim(),support:f.get("support").trim(),rules:f.get("rules").trim(),vapidKey:f.get("vapidKey").trim(),banners:f.get("banners").split(",").map(x=>x.trim()).filter(Boolean)});e.target.querySelector("button").textContent="Save ho gaya"}catch(err){alert("Nahi hua: "+(err.code||err.message))}};
 $("#cf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{await addDoc(collection(db,"categories"),{name:f.get("name").trim(),img:f.get("img").trim(),order:Date.now()})}catch(err){alert("Nahi hua: "+(err.code||err.message))}};
}

function depsView(v){
 const pending=deps.filter(d=>d.status==="pending");
 const done=deps.filter(d=>d.status!=="pending").slice(0,30);
 const row=d=>{
  const st=d.status==="approved"?"✓ Approved":d.status==="rejected"?"✗ Rejected":"Pending";
  const col=d.status==="approved"?"coins":d.status==="rejected"?"dim":"";
  return `<div class="card"><div class="row"><div><div class="t">${esc(d.ign||"—")}</div><div class="dim">UID ${esc(d.ffUid||"")} · ${new Date(d.at).toLocaleString()}</div></div><b class="coins">₹${d.amount||0}</b></div>
  <div class="dim">Naam: <b>${esc(d.payerName||"—")}</b> · UTR: <b>${esc(d.utr||"—")}</b></div>
  <div class="row"><span class="${col}">${st}</span>${d.status==="pending"?`<div class="g" style="width:auto"><button data-depok="${d.id}">Confirm</button><button class="ghost" data-deprej="${d.id}">Reject</button></div>`:""}</div></div>`;
 };
 v.innerHTML=`<div class="card"><div class="t">Pending deposits (${pending.length})</div><div class="dim">Confirm karo tab player ke Deposit me paise jayenge.</div></div>`+
  (pending.length?pending.map(row).join(""):`<p class="dim">Koi pending deposit nahi.</p>`)+
  (done.length?`<div class="card"><div class="t">Pichhle requests</div></div>`+done.map(row).join(""):"");
}

async function loadRooms(list){
 await Promise.all(list.map(async m=>{
  try{const s=await getDoc(doc(db,"matches",m.id,"secret","room"));if(s.exists()){m._roomId=s.data().id||"";m._roomPass=s.data().pass||""}else{m._roomId="";m._roomPass=""}}catch(e){m._roomId="";m._roomPass=""}
 }));
}

async function matchesView(v){
 // Mode picker screen
 if(pickMode){
  v.innerHTML=modesPicker();
  const back=$("#modeback");if(back)back.onclick=()=>{pickMode=false;showForm=false;matchCat="";draw()};
  return;
 }

 const filt=mFilter==="live"?m=>m.status==="live":mFilter==="done"?m=>m.status==="done":m=>m.status!=="live"&&m.status!=="done";
 const list=matches.filter(filt);
 const active=matches.filter(m=>m.status==="live"||m.status==="upcoming"||!m.status).slice(0,8);
 const u=auth.currentUser;
 const adminName=(u&&u.email)?u.email.split("@")[0]:"Admin";
 const nowStr=new Date().toLocaleString([],{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});

 const activeHtml=active.length?active.map((m,i)=>{
  const filled=slotCount[m.id]??0;
  const pct=Math.min(100,Math.round(filled/Math.max(1,m.slots)*100));
  return `<div class="actrow">
   <div class="top">
    <div>
     <div class="ttl"><span class="badge-n">#${i+1}</span> ${esc(m.title)} <span class="idtag">ID:${shortId(m.id)}</span></div>
     <div class="dim" style="font-size:12px;margin-top:4px">🕐 ${fmtDate(m.startTime)}</div>
    </div>
    <button class="pink sm" data-upd="${m.id}">Show</button>
   </div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="dim" style="font-size:12px;text-align:right">${filled}/${m.slots}</div>
  </div>`;
 }).join(""):`<p class="dim">Abhi koi active tournament nahi.</p>`;

 v.innerHTML=`<div class="dash">
  <div class="wel">
   <div class="brand">⭐ SM ARENA</div>
   <div class="hello">👋 ${esc(adminName)}</div>
   <div class="meta">ID: admin · ${esc(nowStr)}</div>
  </div>
  <div class="access">⏰ 24/7 Access</div>
  <div class="sec">
   <h3>⚡ Quick Actions</h3>
   <div class="qgrid">
    <div class="qtile" id="qa-match"><div class="qi">🎯</div>Match</div>
    <div class="qtile" data-tabjump="users"><div class="qi">👥</div>Users</div>
    <div class="qtile" data-tabjump="deps"><div class="qi">💰</div>Deposit</div>
   </div>
  </div>
  <div class="sec">
   <h3>🎯 Active Tournaments <span class="badge-n">${active.length}</span></h3>
   ${activeHtml}
  </div>
  <div class="mtabs">
   <button data-mf="live" class="${mFilter=="live"?"on":""}">Ongoing</button>
   <button data-mf="upcoming" class="${mFilter=="upcoming"?"on":""}">Upcoming</button>
   <button data-mf="done" class="${mFilter=="done"?"on":""}">Results</button>
  </div>
  ${showForm?matchForm():""}
  <div id="mlist"><p class="dim">Load ho raha hai...</p></div>
 </div>
 <button class="fab" id="fabadd" title="Naya match">+</button>`;

 await loadRooms(list);
 if(tab!=="matches")return;
 const box=$("#mlist");
 if(!box)return;
 box.innerHTML=list.length?list.map(mcard).join(""):`<p class="dim">Is tab mein koi match nahi.</p>`;

 if(showForm){
  $("#mfcancel").onclick=()=>{showForm=false;matchCat="";draw()};
  $("#mf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
   try{
    await addDoc(collection(db,"matches"),{cat:f.get("cat"),title:f.get("title").trim(),mode:f.get("mode"),map:f.get("map").trim(),startTime:new Date(f.get("start")).getTime(),slots:+f.get("slots"),prize:+f.get("prize"),fee:+f.get("fee"),prizeInr:+f.get("prizeInr"),payInfo:"8080721723@fam",perKill:+f.get("perKill")||0,banner:f.get("banner").trim(),ranks:f.get("ranks").trim(),status:"upcoming",awarded:false});
    showForm=false;matchCat="";mFilter="upcoming";
   }catch(err){alert("Nahi hua: "+(err.code||err.message))}
  };
 }
 const fab=$("#fabadd");if(fab)fab.onclick=()=>{pickMode=true;showForm=false;matchCat="";draw()};
 const qa=$("#qa-match");if(qa)qa.onclick=()=>{pickMode=true;showForm=false;matchCat="";draw()};
}

function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 const v=$("#view");
 if(tab=="cats")return catsView(v);
 if(tab=="rep")return repView(v);
 if(tab=="deps")return depsView(v);
 if(tab=="matches")return matchesView(v);
 // users
 v.innerHTML=users.map(u=>{
  const w=u.wallet||{};
  const ww=typeof w.w==="number"?w.w:0, dd=typeof w.d==="number"?w.d:0, bb=typeof w.b==="number"?w.b:0;
  const shown=(typeof w.w==="number"||typeof w.d==="number"||typeof w.b==="number")?(ww+dd+bb):(Number(u.coins)||0);
  return `<div class="card"><div class="row"><div><div class="t">${esc(u.ign)}</div><div class="dim">UID ${esc(u.ffUid)}</div></div><div class="row"><b class="coins">₹${Math.round(Number.isFinite(shown)&&Math.abs(shown)<=1e7?shown:0)}</b><button class="ghost sm" data-coin="${u.id}">Set</button></div></div>
  <div class="dim">Wallet → Winning ₹${ww} · Deposit ₹${dd} · Bonus ₹${bb}</div>
  <div class="dim">Balance kam: ± buttons mein -100 likho, ya Set se naya total.</div>
  <div class="g"><button class="ghost" data-wadd="${u.id}">± Deposit</button><button class="ghost" data-wwin="${u.id}">± Winning</button></div></div>`;
 }).join("")||`<p class="dim">Abhi koi user nahi.</p>`;
}

$("#view").onclick=async e=>{
 const tj=e.target.closest("[data-tabjump]");
 if(tj){tab=tj.dataset.tabjump;showForm=false;pickMode=false;openId=null;draw();return}
 const pm=e.target.closest("[data-pickmode]");
 if(pm){matchCat=pm.dataset.pickmode;pickMode=false;showForm=true;openId=null;draw();return}
 const mf=e.target.closest("[data-mf]");
 if(mf){mFilter=mf.dataset.mf;openId=null;draw();return}
 const up=e.target.closest("button[data-upd]");
 if(up){openId=openId===up.dataset.upd?null:up.dataset.upd;draw();return}

 const b=e.target.closest("button[data-st],button[data-room],button[data-pl],button[data-del],button[data-coin],button[data-award],button[data-flag],button[data-delcat],button[data-copy],button[data-wadd],button[data-wwin],button[data-depok],button[data-deprej],button[data-kick]");
 if(!b)return;
 const d=b.dataset;
 try{
  if(d.st){const[id,s]=d.st.split(":");await updateDoc(doc(db,"matches",id),s=="done"?{status:s,doneAt:Date.now()}:{status:s});if(s=="done")await deleteDoc(doc(db,"matches",id,"secret","room")).catch(()=>{})}
  else if(d.room){const m=matches.find(x=>x.id==d.room),n=(await getDocs(collection(db,"matches",d.room,"slots"))).size;
   if(n<m.slots){alert("Abhi "+n+"/"+m.slots+" slot bhare hain. Saare slot bharne ke baad hi room ID de sakte ho.");return}
   await setDoc(doc(db,"matches",d.room,"secret","room"),{id:$("#ri"+d.room).value.trim(),pass:$("#rp"+d.room).value.trim()});b.textContent="Room saved";slotCount[d.room]=n}
  else if(d.del){if(confirm("Ye match delete karna hai?")){await deleteDoc(doc(db,"matches",d.del));openId=null}}
  else if(d.coin){
   const u=users.find(x=>x.id==d.coin)||{},w=u.wallet||{};
   const ask=(label,cur)=>{const r=prompt(label,String(Math.round(Number(cur)||0)));if(r===null)return null;const n=Math.round(Number(r));if(!Number.isFinite(n)||n<0||n>10000000){alert("0 se 1 crore ke beech number likho.");return null}return n};
   const ww=ask("Winning balance kitna RAKHNA hai?",w.w||0);if(ww===null)return;
   const dd=ask("Deposit balance kitna rakhna hai?",w.d||0);if(dd===null)return;
   const bb=ask("Bonus balance kitna rakhna hai?",w.b||0);if(bb===null)return;
   const tx=Array.isArray(w.tx)?w.tx.slice():[];
   tx.unshift({t:"Admin ne balance set kiya",a:(ww+dd+bb)-((+w.w||0)+(+w.d||0)+(+w.b||0)),s:"W ₹"+ww+" · D ₹"+dd+" · B ₹"+bb,at:Date.now()});
   await updateDoc(doc(db,"users",d.coin),{wallet:{w:ww,d:dd,b:bb,tx:tx.slice(0,40)},coins:ww+dd+bb});
  }
  else if(d.wadd||d.wwin){
   const uid=d.wadd||d.wwin, isWin=!!d.wwin;
   const n=parseInt(prompt((isWin?"Winning":"Deposit")+" change: add 100, kam -100"),10);
   if(!n||!Number.isFinite(n)){alert("Sahi number likho. Kam ke liye minus.");return}
   if(Math.abs(n)>10000000){alert("Bahut bada number.");return}
   const uref=doc(db,"users",uid);
   await runTransaction(db,async t=>{
    const snap=await t.get(uref);
    const cur=snap.exists()?(snap.data().wallet||{}):{};
    const W={w:typeof cur.w==="number"?cur.w:0, d:typeof cur.d==="number"?cur.d:0, b:typeof cur.b==="number"?cur.b:0, tx:Array.isArray(cur.tx)?cur.tx:[]};
    if(isWin)W.w=Math.max(0,W.w+n); else W.d=Math.max(0,W.d+n);
    W.tx.unshift({t:(isWin?"Admin Winning":"Admin Deposit")+(n>=0?" credit":" debit"),a:n,s:"Success",at:Date.now()});
    W.tx=W.tx.slice(0,40);
    t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
   });
  }
  else if(d.depok||d.deprej){
   const id=d.depok||d.deprej, ok=!!d.depok;
   const dref=doc(db,"deposits",id);
   const ds=await getDoc(dref);
   if(!ds.exists()||ds.data().status!=="pending"){alert("Ye request already process ho chuki hai.");return}
   const data=ds.data();
   if(ok){
    if(!confirm("₹"+data.amount+" confirm? "+(data.ign||"")+" ke Deposit me jayega."))return;
    if(deps.some(x=>x.id!==id&&x.utr===data.utr&&x.status!=="rejected")&&!confirm("UTR dusre deposit mein bhi hai. Phir bhi?"))return;
    const uref=doc(db,"users",data.uid);
    const res=await runTransaction(db,async t=>{
     const ds2=await t.get(dref);
     if(!ds2.exists()||ds2.data().status!=="pending")return "done";
     const us=await t.get(uref);
     if(!us.exists())return "nouser";
     const cur=us.data().wallet||{};
     const W={w:typeof cur.w==="number"?cur.w:0, d:typeof cur.d==="number"?cur.d:0, b:typeof cur.b==="number"?cur.b:0, tx:Array.isArray(cur.tx)?cur.tx:[]};
     const amt=Number(ds2.data().amount)||0;
     W.d+=amt;
     W.tx.unshift({t:"Deposit confirmed ₹"+amt,a:amt,s:"Success",at:Date.now()});
     W.tx=W.tx.slice(0,40);
     t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
     t.update(dref,{status:"approved",approvedAt:Date.now()});
     return "ok";
    });
    if(res==="done")alert("Already process.");
    if(res==="nouser")alert("User nahi mila.");
   }else{
    if(!confirm("Reject karna hai?"))return;
    await updateDoc(dref,{status:"rejected",rejectedAt:Date.now()});
   }
  }
  else if(d.copy){const m=matches.find(x=>x.id==d.copy),t=new Date(m.startTime).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),txt="⏰ "+m.title+" "+t+" par shuru hoga. App kholo aur slot check karo!";
   try{await navigator.clipboard.writeText(txt);b.textContent="Copy ho gaya"}catch(e){prompt("Copy karo:",txt)}}
  else if(d.delcat){if(confirm("Mode delete?"))await deleteDoc(doc(db,"categories",d.delcat))}
  else if(d.flag){const[mid,uid,f]=d.flag.split(":"),on=!b.classList.contains("on"),m=matches.find(x=>x.id==mid),pr=doc(db,"matches",mid,"players",uid);
   if(f=="paid"&&m.fee>0){
    const ps=await getDoc(pr),taken=new Set((await getDocs(collection(db,"matches",mid,"slots"))).docs.map(x=>x.id)),bt=writeBatch(db);
    if(on){
     if(taken.size>=m.slots){alert("Slots full.");return}
     let n=ps.data().want;if(!(n>=1&&n<=m.slots)||taken.has(String(n))){n=1;while(taken.has(String(n)))n++}
     bt.set(doc(db,"matches",mid,"slots",String(n)),{uid});bt.update(pr,{paid:true,slot:n});
    }else{
     const cur=ps.data().slot;if(cur)bt.delete(doc(db,"matches",mid,"slots",String(cur)));
     bt.update(pr,{paid:false,slot:null});
    }
    await bt.commit();
    slotCount[mid]=(await getDocs(collection(db,"matches",mid,"slots"))).size;
    const r=document.querySelector(`[data-pl="${mid}"]`);if(r)r.click();
   }else if(f=="prizePaid"){
    let amt=0;
    if(on){const r=prompt("Prize ₹?",String(m.prizeInr||0));if(r===null)return;amt=Math.max(0,parseInt(r,10)||0)}
    await updateDoc(pr,{prizePaid:on,prizeAmt:amt});
    b.classList.toggle("on",on);b.classList.toggle("ghost",!on);b.textContent=on?"Prize diya ₹"+amt:"Prize diya";
   }else{await updateDoc(pr,{[f]:on});b.classList.toggle("on",on);b.classList.toggle("ghost",!on)}
  }
  else if(d.kick){
   const[mid,uid]=d.kick.split(":"),m=matches.find(x=>x.id==mid);
   const fee=Number(m?.fee)||0;
   if(!confirm((m?.title||"Match")+" se player REMOVE karna hai?"+(fee?`\n\nFee ₹${fee} unke Deposit wallet mein refund ho jayegi.`:"")))return;
   const pr=doc(db,"matches",mid,"players",uid);
   const ps=await getDoc(pr);
   if(!ps.exists()){alert("Player pehle se remove hai.");return}
   const pdata=ps.data(),slot=pdata.slot;
   const wasPaid=pdata.paid===true||pdata.paidVia==="wallet";
   await runTransaction(db,async t=>{
    if(wasPaid&&fee>0){
     const uref=doc(db,"users",uid);
     const us=await t.get(uref);
     if(us.exists()){
      const cur=us.data().wallet||{};
      const W={w:typeof cur.w==="number"?cur.w:0,d:typeof cur.d==="number"?cur.d:0,b:typeof cur.b==="number"?cur.b:0,tx:Array.isArray(cur.tx)?cur.tx.slice():[]};
      W.d+=fee;
      W.tx.unshift({t:"Refund: "+(m.title||"Match")+" (remove)",a:fee,s:"Success",at:Date.now()});
      W.tx=W.tx.slice(0,40);
      t.update(uref,{wallet:W,coins:W.w+W.d+W.b});
     }
    }
    t.delete(pr);
    if(slot)t.delete(doc(db,"matches",mid,"slots",String(slot)));
   });
   try{slotCount[mid]=(await getDocs(collection(db,"matches",mid,"slots"))).size}catch(e){}
   alert(wasPaid&&fee>0?`Player remove. ₹${fee} Deposit mein refund.`:"Player remove ho gaya.");
   const r=document.querySelector(`[data-pl="${mid}"]`);if(r)r.click();
  }
  else if(d.pl){
   openId=d.pl;
   const s=await getDocs(collection(db,"matches",d.pl,"players")),m=matches.find(x=>x.id==d.pl);
   const via=p=>{const v=p.data().paidVia;return v==="wallet"?'<span class="coins">Wallet se pay ✓</span>':v==="upi"?'<span class="dim">UPI</span>':'<span class="dim">—</span>'};
   const fee=Number(m?.fee)||0;
   draw();
   setTimeout(()=>{
    const el=$("#pl"+d.pl);
    if(!el)return;
    el.innerHTML=s.empty?`<p class="dim">Koi player nahi.</p>`:`<div class="dim">Player remove = slot khali + fee refund (Deposit)</div>`+s.docs.map(p=>`<div class="card" style="padding:10px"><div class="row"><span>${p.data().slot?"#"+p.data().slot+" ":""}<b>${esc(p.data().ign)}</b> <span class="dim">${esc(p.data().ffUid)}</span></span><input class="n" type="number" min="0" placeholder="points" data-u="${p.id}"></div><div class="dim">Payment: ${via(p)} ${p.data().paid?'<b class="coins">· Fee mili</b>':''}</div>${p.data().paidVia==="wallet"?`<div class="dim">Wallet se fee kat gayi</div>`:`<div class="dim">Payer: <b>${esc(p.data().payerName||"—")}</b> · UTR: <b>${esc(p.data().utr||"—")}</b></div>`}<div class="g"><button class="${p.data().paid?"on":"ghost"}" data-flag="${d.pl}:${p.id}:paid">Fee mili</button><button class="${p.data().prizePaid?"on":"ghost"}" data-flag="${d.pl}:${p.id}:prizePaid">${p.data().prizePaid?"Prize diya ₹"+(p.data().prizeAmt||0):"Prize diya"}</button></div><button class="ghost" data-kick="${d.pl}:${p.id}" style="border-color:#ff6b6b;color:#ff6b6b">Remove${fee&&(p.data().paid||p.data().paidVia==="wallet")?" + ₹"+fee+" refund":""}</button></div>`).join("")+`<button data-award="${d.pl}" ${m.awarded?"disabled":""}>${m.awarded?"Coins de diye":"Coins do aur match khatam"}</button>`;
   },50);
  }
  else if(d.award){const ins=[...($("#pl"+d.award)?.querySelectorAll("input[data-u]")||[])].filter(i=>+i.value>0);
   if(!ins.length||!confirm("Coins de do? Dobara nahi hoga."))return;
   for(const i of ins)await updateDoc(doc(db,"users",i.dataset.u),{coins:increment(+i.value)});
   await updateDoc(doc(db,"matches",d.award),{status:"done",awarded:true,doneAt:Date.now()});
   await deleteDoc(doc(db,"matches",d.award,"secret","room")).catch(()=>{});
   openId=null;mFilter="done";
  }
 }catch(err){alert("Nahi hua: "+(err.code||err.message))}
};
</script>
</body>
</html>
